[package]
name = "securovix-guard"
version = "0.1.0"
edition = "2021"
description = "Securovix Guard endpoint agent: process, file and autostart telemetry, local ransomware stop, isolation and quarantine."
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "securovix-guard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
sysinfo = "0.30"
notify = "6.1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
