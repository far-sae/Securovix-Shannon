<script>
let CID=null,SCANS=[],POLL=null,EVT=null;
const $=id=>document.getElementById(id),M=$('M');

/* ============================================================
   Constellation — 3D agent graph (Canvas 2D).
   Each dot IS an agent. Edges connect related agents. Drag to rotate
   the camera; click an agent to see its live activity in a popover;
   hover for a name+status tooltip. Animated packet beams travel along
   edges as one agent hands off to another, so you literally see the
   conversation happening. Used by both the New Scan live view (10
   pipeline phases) and the Code Scan war-room (4 agents).
   ============================================================ */
class Constellation {
  constructor(host, opts) {
    this.host = host;                    // .constel container element
    this.c = host.querySelector('.constel-canvas');
    this.pop = host.querySelector('.constel-pop');
    this.tip = host.querySelector('.constel-tip');
    this.ctx = this.c.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.opts = Object.assign({ agents: [], edges: [], onSelect: null }, opts);
    this.nodes = this.opts.agents.map(a => ({
      ...a, state: 'idle', pulse: 0, output: '', stepText: '',
      _proj: null, _projScreen: 0,
    }));
    // Each edge: [a, b]  or  [a, b, label]  — label drives GraphRAG-style relationship text along the line.
    this.edges = (this.opts.edges || []).map(e => ({ a: e[0], b: e[1], label: e[2] || '', glow: 0 }));
    this.beams = [];
    this.bgStars = this._buildStars(120);
    this.particles = this._buildParticles(opts.particleCount || 400);
    this.zoom = 1.0; this.targetZoom = 1.0;
    // Default isometric-ish camera tilt so the constellation reads 3D from frame 1
    this.userRotY = -0.18; this.userRotX = 0.22; this.driftY = 0;
    this.autoDrift = true; this._idleTimer = 0;
    this.dragging = false; this.dragMoved = false;
    this.lastMx = 0; this.lastMy = 0;
    this.selectedId = null; this.hoverId = null;
    this._lastT = 0; this._lastSpeaker = null; this.dead = false;
    this._bind();
    this._resize();
    try {
      this._ro = new ResizeObserver(() => this._resize());
      this._ro.observe(this.host);  // observe parent — canvas inherits its size
      this._ro.observe(this.c);
    } catch (e) { console.warn('Constellation: ResizeObserver unavailable', e); }
    this._winResize = () => this._resize();
    window.addEventListener('resize', this._winResize);
    // Defer first tick a bit so DOM layout has definitely settled.
    this._raf = requestAnimationFrame(t => this._tick(t));
    setTimeout(() => this._resize(), 50);
    setTimeout(() => this._resize(), 250);
  }
  destroy(){
    this.dead = true;
    cancelAnimationFrame(this._raf);
    try{ this._ro?.disconnect(); }catch{}
    try{ window.removeEventListener('resize', this._winResize); }catch{}
  }

  _buildStars(n){
    const out = [];
    for (let i = 0; i < n; i++){
      // Distribute on a far-back hemisphere; pleasant speckle behind everything
      const phi = Math.acos(2 * Math.random() - 1);
      const th = Math.random() * Math.PI * 2;
      const r = 1.7 + Math.random() * 0.6;
      out.push({
        x: Math.sin(phi) * Math.cos(th) * r,
        y: (Math.cos(phi) * 0.7) * r,
        z: Math.sin(phi) * Math.sin(th) * r,
        a: 0.18 + Math.random() * 0.55,
        s: 0.35 + Math.random() * 0.95,
        tw: Math.random() * Math.PI * 2,
      });
    }
    return out;
  }

  /* ======== Particle field ========
     Idle state = several concentric rings of small dots (the "circle" the
     user sees before any agent activates).  When an agent activates, the
     nearest ~16 unowned dots are claimed as satellites and lerp toward a
     Fibonacci-sphere distribution around that agent's hub — that's the
     starburst look in the reference images.  When the agent finishes,
     satellites stay attached but turn green.  reset() releases all back to
     their home ring positions. */
  _buildParticles(n){
    const out = [];
    // Cleaner concentric rings (low jitter) for a crisp "starting circle" look.
    const rings = [
      { count: 36, r: 1.55, y: -0.95, jitter: 0.015 },
      { count: 60, r: 1.78, y: -0.50, jitter: 0.018 },
      { count: 80, r: 1.92, y:  0.00, jitter: 0.018 },
      { count: 64, r: 1.78, y:  0.50, jitter: 0.018 },
      { count: 40, r: 1.55, y:  0.95, jitter: 0.015 },
      { count: 32, r: 2.20, y:  0.00, jitter: 0.02  },
      { count: 48, r: 1.10, y:  0.00, jitter: 0.025 },
      { count: 40, r: 0.65, y:  0.00, jitter: 0.03  },
    ];
    let id = 0;
    for (const ring of rings){
      for (let i = 0; i < ring.count; i++){
        const ang = (i / ring.count) * Math.PI * 2 + Math.random() * 0.06;
        const jx = (Math.random() - 0.5) * ring.jitter;
        const jy = (Math.random() - 0.5) * ring.jitter * 1.4;
        const jz = (Math.random() - 0.5) * ring.jitter;
        const hx = Math.cos(ang) * ring.r + jx;
        const hy = ring.y + jy;
        const hz = Math.sin(ang) * ring.r + jz;
        out.push({
          id: id++,
          homeX: hx, homeY: hy, homeZ: hz,
          x: hx, y: hy, z: hz,
          tx: hx, ty: hy, tz: hz,
          agentId: null, satIdx: -1,
          color: '140,180,210',  // cyan-blue (idle)
          tint: 0.55,
          size: 0.8 + Math.random() * 0.7,
          phase: Math.random() * Math.PI * 2,
          phaseSpeed: 0.0004 + Math.random() * 0.0008,
        });
        if (out.length >= n) return out;
      }
    }
    return out;
  }
  _claimSatellites(agentId, count = 32){
    const agent = this.nodes.find(n => n.id === agentId); if (!agent) return;
    // Prefer particles that are unowned, then those already on this agent.
    const cand = this.particles
      .filter(p => p.agentId === null || p.agentId === agentId)
      .sort((a, b) => {
        const da = (a.x - agent.x)**2 + (a.y - agent.y)**2 + (a.z - agent.z)**2;
        const db = (b.x - agent.x)**2 + (b.y - agent.y)**2 + (b.z - agent.z)**2;
        return da - db;
      });
    const pool = cand.slice(0, count);
    const teamRGB = agent.team === 'red'  ? '255,140,140'
                  : agent.team === 'blue' ? '155,200,255'
                  : '225,255,140';
    pool.forEach((p, i) => {
      p.agentId = agentId;
      p.satIdx = i;
      // Fibonacci-sphere distribution gives an even starburst around the hub.
      const total = pool.length;
      const phi = Math.acos(1 - 2 * (i + 0.5) / total);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      // Wider spread + length variation gives the "rays radiating outward" look
      // from the reference images.
      const r = 0.22 + Math.random() * 0.16;
      p.tx = agent.x + Math.sin(phi) * Math.cos(theta) * r;
      p.ty = agent.y + Math.cos(phi) * r;
      p.tz = agent.z + Math.sin(phi) * Math.sin(theta) * r;
      p.color = teamRGB; p.tint = 0.9;
    });
  }
  _releaseSatellites(agentId, makeFree = false){
    for (const p of this.particles){
      if (p.agentId !== agentId) continue;
      if (makeFree){
        p.agentId = null; p.satIdx = -1;
        p.tx = p.homeX; p.ty = p.homeY; p.tz = p.homeZ;
        p.color = '140,180,210'; p.tint = 0.55;
      } else {
        // Done — Securovix green-400 (#4ade80), satellites stay attached
        p.color = '74,222,128'; p.tint = 0.7;
      }
    }
  }
  _resetSatellites(){
    for (const p of this.particles){
      p.agentId = null; p.satIdx = -1;
      p.tx = p.homeX; p.ty = p.homeY; p.tz = p.homeZ;
      p.color = '140,180,210'; p.tint = 0.55;
    }
  }

  _bind(){
    const c = this.c;
    const getXY = e => {
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX, y: t.clientY };
    };
    c.addEventListener('mousedown', e => this._down(getXY(e)));
    c.addEventListener('touchstart', e => this._down(getXY(e)), { passive: false });
    window.addEventListener('mousemove', e => this._move(getXY(e)));
    window.addEventListener('touchmove', e => { if (this.dragging) { e.preventDefault?.(); this._move(getXY(e)); } }, { passive: false });
    window.addEventListener('mouseup', e => this._up(getXY(e)));
    window.addEventListener('touchend', e => this._up(this._lastTouch || { x: 0, y: 0 }));
    c.addEventListener('mousemove', e => this._hover(e));
    c.addEventListener('mouseleave', () => { this.hoverId = null; this._renderTip(null); });
    // Mouse-wheel zoom — clamps between 0.45× and 2.6×, smoothed each frame.
    c.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.92 : 1.08;
      this.targetZoom = Math.max(0.45, Math.min(2.6, this.targetZoom * factor));
      this.autoDrift = false; this._idleTimer = 0;
    }, { passive: false });
  }
  _down(p){
    this.dragging = true; this.dragMoved = false;
    this.lastMx = p.x; this.lastMy = p.y; this._downX = p.x; this._downY = p.y;
    this.autoDrift = false; this._idleTimer = 0;
  }
  _move(p){
    if (!this.dragging) return;
    const dx = p.x - this.lastMx, dy = p.y - this.lastMy;
    if (Math.abs(p.x - this._downX) > 3 || Math.abs(p.y - this._downY) > 3) this.dragMoved = true;
    this.userRotY += dx * 0.008;
    this.userRotX = Math.max(-0.95, Math.min(0.95, this.userRotX + dy * 0.005));
    this.lastMx = p.x; this.lastMy = p.y;
  }
  _up(p){
    if (this.dragging && !this.dragMoved){
      // It was a click — hit-test
      const r = this.c.getBoundingClientRect();
      const x = p.x - r.left, y = p.y - r.top;
      const hit = this._hitTest(x, y);
      this._select(hit ? hit.id : null);
    }
    this.dragging = false;
    this._idleTimer = 0; // wait before resuming auto-drift
  }
  _hover(e){
    const r = this.c.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const hit = this._hitTest(x, y);
    const id = hit ? hit.id : null;
    if (id !== this.hoverId){
      this.hoverId = id;
      this.c.style.cursor = id ? 'pointer' : '';
    }
    this._renderTip(hit, e.clientX, e.clientY);
  }
  _hitTest(x, y){
    // Front-most node wins (largest pe = closest to camera)
    let best = null, bestPe = -1;
    for (const n of this.nodes){
      if (!n._proj) continue;
      const dx = x - n._proj.sx, dy = y - n._proj.sy;
      const r = (8 + 6 * n._proj.pe) * 1.6;
      if (dx*dx + dy*dy <= r*r && n._proj.pe > bestPe){
        best = n; bestPe = n._proj.pe;
      }
    }
    return best;
  }
  _select(id){
    this.selectedId = id;
    this.opts.onSelect?.(id ? this.nodes.find(n => n.id === id) : null);
    this._renderPop();
  }
  _resize(){
    // Try the canvas element first; fall back to the host container if the canvas
    // hasn't been laid out yet (common on the very first frame).
    const rc = this.c.getBoundingClientRect();
    let w = rc.width, h = rc.height;
    if (!w || !h){
      const rh = this.host.getBoundingClientRect();
      w = rh.width || this.host.offsetWidth || this.host.clientWidth || 0;
      h = rh.height || this.host.offsetHeight || this.host.clientHeight || 0;
    }
    if (!w || !h) return false;
    this.W = w; this.H = h;
    this.c.width = Math.floor(w * this.dpr);
    this.c.height = Math.floor(h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    return true;
  }
  _project(x, y, z){
    const ry = this.driftY + this.userRotY, rx = this.userRotX;
    const cy = Math.cos(ry), sy = Math.sin(ry);
    const cx = Math.cos(rx), sx = Math.sin(rx);
    let X = x*cy + z*sy;
    let Z = -x*sy + z*cy;
    let Y = y*cx - Z*sx;
    Z = y*sx + Z*cx;
    const scale = Math.min(this.W, this.H) * 0.34 * this.zoom;
    // Clamp perspective so radii can never go negative when the camera
    // tilts past the focal plane (Z < -1.7 would otherwise flip pe negative
    // and crash ctx.arc with a negative radius).
    const persp = Math.max(0.28, Math.min(2.4, 1.7 / Math.max(0.4, 1.7 + Z)));
    return { sx: this.W/2 + X*scale*persp, sy: this.H/2 + Y*scale*persp, sz: Z, pe: persp };
  }

  // ---- Public API ----
  setState(id, state){
    const n = this.nodes.find(n => n.id === id); if (!n) return;
    n.state = state;
    if (state === 'thinking' || state === 'active'){
      n.pulse = 1.5;
      this._claimSatellites(id, 32);
      if (this._lastSpeaker && this._lastSpeaker !== id) this.beam(this._lastSpeaker, id);
      this._lastSpeaker = id;
    } else if (state === 'done'){
      n.pulse = Math.max(n.pulse, 0.5);
      this._releaseSatellites(id, false);
      this._lastSpeaker = id;
    } else if (state === 'failed'){
      n.pulse = 0;
      this._releaseSatellites(id, true);
    }
    if (this.selectedId === id) this._renderPop();
  }
  setStep(id, text){
    const n = this.nodes.find(n => n.id === id); if (!n) return;
    n.stepText = text || '';
    if (this.selectedId === id) this._renderPop();
  }
  setOutput(id, text){
    const n = this.nodes.find(n => n.id === id); if (!n) return;
    n.output = text || '';
    if (this.selectedId === id) this._renderPop();
  }
  appendOutput(id, line){
    const n = this.nodes.find(n => n.id === id); if (!n) return;
    if (!line) return;
    n._lines = n._lines || [];
    n._lines.push(line);
    if (n._lines.length > 12) n._lines.shift();   // keep the last 12 human lines only
    n.output = n._lines.join('\n');
    if (this.selectedId === id) this._renderPop();
  }
  beam(fromId, toId){
    const f = this.nodes.find(n => n.id === fromId);
    const t = this.nodes.find(n => n.id === toId);
    if (!f || !t) return;
    this.beams.push({ from: fromId, to: toId, t: 0, life: 1400 + Math.random()*350 });
    // Light up the connecting edge
    for (const e of this.edges){
      if ((e.a === fromId && e.b === toId) || (e.b === fromId && e.a === toId)){ e.glow = 1; }
    }
  }
  reset(){
    for (const n of this.nodes){ n.state='idle'; n.pulse=0; n.output=''; n.stepText=''; n._lines=[]; }
    this.beams = []; this._lastSpeaker = null;
    for (const e of this.edges) e.glow = 0;
    this._resetSatellites();
    if (this.selectedId) this._renderPop();
  }

  // ---- Popover + Tooltip rendering (DOM, follows node) ----
  _renderPop(){
    if (!this.pop) return;
    if (!this.selectedId){ this.pop.hidden = true; return; }
    const n = this.nodes.find(x => x.id === this.selectedId);
    if (!n){ this.pop.hidden = true; return; }
    this.pop.hidden = false;
    this.pop.className = 'constel-pop' + (n.team ? ' team-' + n.team : '') + ' s-' + n.state;
    const statusLabel = ({ idle: 'idle', thinking: 'thinking', active: 'active', done: 'done', failed: 'failed' })[n.state] || n.state;
    const isThinking = n.state === 'thinking' || n.state === 'active';
    const subText = n.stepText || (n.role ? n.role : '');
    const bodyText = n.output || '';
    const escape = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    this.pop.innerHTML = `
      <div class="constel-pop-h">
        <span class="constel-pop-dot"></span>
        <span class="constel-pop-name">${escape(n.name || n.id)}</span>
        <span class="constel-pop-status">${escape(statusLabel)}</span>
      </div>
      ${subText ? `<div class="constel-pop-sub">${escape(subText)}</div>` : ''}
      <div class="constel-pop-body">${escape(bodyText)}</div>
      ${isThinking ? `<div class="constel-pop-foot"><span class="ts-typing"><i></i><i></i><i></i></span><span>live</span></div>` : ''}
    `;
  }
  _renderTip(node, mouseX, mouseY){
    if (!this.tip) return;
    if (!node || node.id === this.selectedId){ this.tip.hidden = true; return; }
    this.tip.hidden = false;
    const r = this.c.getBoundingClientRect();
    const p = node._proj;
    if (!p) return;
    const status = ({ idle: 'idle', thinking: 'thinking', active: 'active', done: 'done', failed: 'failed' })[node.state] || node.state;
    this.tip.innerHTML = `${node.name || node.id}<span class="tag s-${node.state}">${status}</span>`;
    this.tip.style.left = p.sx + 'px';
    this.tip.style.top = p.sy + 'px';
  }
  _positionPop(){
    if (!this.pop || this.pop.hidden) return;
    const n = this.nodes.find(x => x.id === this.selectedId);
    if (!n || !n._proj) return;
    this.pop.style.left = n._proj.sx + 'px';
    this.pop.style.top = n._proj.sy + 'px';
  }

  _tick(t){
    if (this.dead) return;
    if (!document.body.contains(this.c)){ this.destroy(); return; }
    try { this._draw(t); }
    catch (e) {
      if (!this._loggedErr) { console.error('Constellation draw error:', e); this._loggedErr = true; }
    }
    this._raf = requestAnimationFrame(tt => this._tick(tt));
  }
  _draw(t){
    const dt = Math.min(50, t - (this._lastT || t));
    this._lastT = t;

    // Resume gentle drift only after the user has been still for a moment.
    if (!this.dragging){
      this._idleTimer += dt;
      if (this._idleTimer > 2000) this.autoDrift = true;
    }
    if (this.autoDrift && !this.dragging) this.driftY += 0.00018 * dt;

    let { ctx, W, H } = this;
    if (!W || !H){ this._resize(); W = this.W; H = this.H; }
    if (!W || !H) return;  // outer _tick will re-RAF

    // Smooth zoom toward target (mouse wheel)
    this.zoom += (this.targetZoom - this.zoom) * Math.min(1, dt / 120);

    // Animate particles toward their targets (idle home or agent satellite slot)
    const pEase = 1 - Math.pow(0.001, dt / 1000);
    for (const p of this.particles){
      p.x += (p.tx - p.x) * pEase;
      p.y += (p.ty - p.y) * pEase;
      p.z += (p.tz - p.z) * pEase;
      p.phase += p.phaseSpeed * dt;
    }

    // Spawn synapse packets only on edges where at least one endpoint is
    // currently active — keeps idle state clean (no random flying packets).
    this.packets = this.packets || [];
    this._packTimer = (this._packTimer || 0) + dt;
    if (this._packTimer > 220 && this.edges.length){
      this._packTimer = 0;
      const hotEdges = this.edges.filter(e => {
        const na = this.nodes.find(n => n.id === e.a);
        const nb = this.nodes.find(n => n.id === e.b);
        return na && nb && (na.state === 'thinking' || nb.state === 'thinking');
      });
      if (hotEdges.length && this.packets.length < 90){
        const e = hotEdges[Math.floor(Math.random() * hotEdges.length)];
        const na = this.nodes.find(n => n.id === e.a);
        const nb = this.nodes.find(n => n.id === e.b);
        // Direction: from the active speaker toward the listener.
        const aActive = na.state === 'thinking';
        this.packets.push({
          from: aActive ? na.id : nb.id,
          to:   aActive ? nb.id : na.id,
          t: 0, life: 1300 + Math.random()*700,
          size: 0.6 + Math.random()*0.7,
          hot: true,
        });
      }
    }

    // ===== 1. BACKGROUND — deep cosmic vignette + drifting nebula + brain envelope
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createRadialGradient(W/2, H*0.5, 0, W/2, H*0.5, Math.max(W, H) * 0.75);
    bg.addColorStop(0, 'rgba(20,20,20,0.92)');
    bg.addColorStop(0.55, 'rgba(11,11,11,0.96)');
    bg.addColorStop(1, '#000');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const nx = W * (0.32 + 0.18 * Math.sin(t * 0.00025));
    const ny = H * (0.45 + 0.12 * Math.cos(t * 0.00031));
    const neb = ctx.createRadialGradient(nx, ny, 0, nx, ny, Math.min(W, H) * 0.55);
    neb.addColorStop(0, 'rgba(212,247,69,0.075)');
    neb.addColorStop(0.6, 'rgba(96,165,250,0.025)');
    neb.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);

    // ===== 2. BACKGROUND STARS — twinkling speckle
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.bgStars){
      const p = this._project(s.x, s.y, s.z);
      const tw = 0.65 + 0.35 * Math.sin(t * 0.0015 + s.tw);
      const a = s.a * tw * (p.sz < 0 ? 1 : 0.4);
      if (a < 0.04) continue;
      ctx.fillStyle = `rgba(220,235,255,${a})`;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, s.s * (0.5 + p.pe*0.7), 0, Math.PI*2);
      ctx.fill();
    }

    // ===== 3. PROJECT NODES + breathing pulse
    for (const n of this.nodes){
      n._proj = this._project(n.x, n.y, n.z);
      n._breath = 1 + 0.07 * Math.sin(t * 0.0022 + (n.x * 3 + n.y * 5));
    }

    // ===== 3b. PARTICLE FIELD — concentric rings at idle, starbursts when active
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.particles){
      // Tiny wobble around target so particles never look frozen
      const wob = 0.018;
      const wx = wob * Math.sin(p.phase);
      const wy = wob * Math.cos(p.phase * 1.3);
      const wz = wob * Math.sin(p.phase * 0.7);
      const proj = this._project(p.x + wx, p.y + wy, p.z + wz);
      const a = p.tint * (0.55 + 0.45 * proj.pe);
      // Subtle radial spoke from satellite to its hub (the "starburst" rays)
      if (p.agentId){
        const ag = this.nodes.find(n => n.id === p.agentId);
        if (ag && ag._proj){
          ctx.strokeStyle = `rgba(${p.color},${0.18 * proj.pe})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(proj.sx, proj.sy);
          ctx.lineTo(ag._proj.sx, ag._proj.sy);
          ctx.stroke();
        }
      }
      // Particle dot
      const sz = p.size * proj.pe * 1.4;
      ctx.fillStyle = `rgba(${p.color},${a})`;
      ctx.beginPath();
      ctx.arc(proj.sx, proj.sy, sz, 0, Math.PI*2);
      ctx.fill();
      // Soft halo for owned satellites (so the starburst reads as a cluster)
      if (p.agentId){
        const hg = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, sz * 4);
        hg.addColorStop(0, `rgba(${p.color},${a * 0.45})`);
        hg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, sz * 4, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // ---- Helper: quadratic bezier control point that arcs perpendicular to the edge.
    // Same edge always curves the same way (so synapse packets travel a stable path).
    const edgeCurve = (pa, pb, salt = 0) => {
      const mx = (pa.sx + pb.sx) / 2, my = (pa.sy + pb.sy) / 2;
      const ex = pb.sx - pa.sx, ey = pb.sy - pa.sy;
      const len = Math.sqrt(ex*ex + ey*ey) || 1;
      const nx2 = -ey / len, ny2 = ex / len;
      const arc = Math.min(70, len * 0.18) * (1 + salt);
      return { mx, my, cx: mx + nx2 * arc, cy: my + ny2 * arc };
    };
    const sampleBezier = (pa, c, pb, k) => ({
      x: (1-k)*(1-k)*pa.sx + 2*(1-k)*k*c.cx + k*k*pb.sx,
      y: (1-k)*(1-k)*pa.sy + 2*(1-k)*k*c.cy + k*k*pb.sy,
    });

    // ===== 4. EDGES (typed relations) — GraphRAG / mirofish style.
    // Always visible (faint at idle, bright when hot) with the relationship
    // label drawn along the line at midpoint, rotated to follow the edge.
    for (const e of this.edges){
      const na = this.nodes.find(n => n.id === e.a);
      const nb = this.nodes.find(n => n.id === e.b);
      if (!na || !nb) continue;
      const pa = na._proj, pb = nb._proj;
      const c = edgeCurve(pa, pb);
      const isHot = na.state === 'thinking' || nb.state === 'thinking' ||
                    na.id === this.hoverId || nb.id === this.hoverId ||
                    na.id === this.selectedId || nb.id === this.selectedId;
      const glow = e.glow;
      const z = (pa.sz + pb.sz) / 2;
      const baseAlpha = Math.max(0.10, 0.32 - z * 0.16);
      const alpha = isHot ? Math.min(0.95, baseAlpha + 0.5) : baseAlpha;

      // Line itself — thin neon when hot, dim gray at idle
      if (isHot || glow > 0.08){
        ctx.strokeStyle = `rgba(212,247,69,${alpha * 0.35})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy);
        ctx.quadraticCurveTo(c.cx, c.cy, pb.sx, pb.sy);
        ctx.stroke();
        ctx.strokeStyle = glow > 0.05
          ? `rgba(255,210,150,${Math.min(1, alpha + glow * 0.5)})`
          : `rgba(212,247,69,${alpha})`;
      } else {
        ctx.strokeStyle = `rgba(150,150,150,${alpha})`;
      }
      ctx.lineWidth = isHot ? 1.4 : 0.9;
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy);
      ctx.quadraticCurveTo(c.cx, c.cy, pb.sx, pb.sy);
      ctx.stroke();
      e.glow *= Math.pow(0.92, dt / 16);

      // ---- GraphRAG-style edge label at the curve midpoint ----
      if (e.label){
        // Bezier midpoint (k=0.5)
        const lx = 0.25*pa.sx + 0.5*c.cx + 0.25*pb.sx;
        const ly = 0.25*pa.sy + 0.5*c.cy + 0.25*pb.sy;
        // Tangent angle along the curve — keep text readable (no upside-down)
        const tx = pb.sx - pa.sx, ty = pb.sy - pa.sy;
        let ang = Math.atan2(ty, tx);
        if (ang > Math.PI/2) ang -= Math.PI;
        else if (ang < -Math.PI/2) ang += Math.PI;
        const labelAlpha = isHot ? 0.95 : 0.45;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(ang);
        ctx.font = `${isHot ? 700 : 600} ${isHot ? 9.5 : 8.5}px "JetBrains Mono",monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const txt = e.label;
        const tw = ctx.measureText(txt).width;
        // Background plate so text reads over the line
        ctx.fillStyle = `rgba(11,11,11,${isHot ? 0.92 : 0.78})`;
        ctx.fillRect(-tw/2 - 5, -7, tw + 10, 14);
        ctx.fillStyle = isHot ? `rgba(212,247,69,${labelAlpha})` : `rgba(190,190,190,${labelAlpha})`;
        ctx.fillText(txt, 0, 0);
        ctx.restore();
      }
    }

    // ===== 5. SYNAPSE PACKETS — continuous firing along curved axons
    this.packets = this.packets.filter(pk => {
      pk.t += dt;
      const k = pk.t / pk.life;
      if (k >= 1) return false;
      const f = this.nodes.find(n => n.id === pk.from);
      const tg = this.nodes.find(n => n.id === pk.to);
      if (!f || !tg || !f._proj || !tg._proj) return false;
      const fp = f._proj, tp = tg._proj;
      const c = edgeCurve(fp, tp);
      const pos = sampleBezier(fp, c, tp, k);
      const fade = Math.min(k * 4, (1 - k) * 4, 1);
      const sz = (1.6 + pk.size) * (pk.hot ? 1.6 : 1);
      const a = (pk.hot ? 0.95 : 0.6) * fade;
      const grd = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, sz * 4);
      grd.addColorStop(0,    `rgba(245,255,200,${a})`);
      grd.addColorStop(0.45, `rgba(212,247,69,${a * 0.5})`);
      grd.addColorStop(1,    'rgba(212,247,69,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, sz * 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(255,245,210,${a})`;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, sz, 0, Math.PI*2); ctx.fill();
      return true;
    });

    // ===== 6. NODES (neurons) — back-to-front, multi-layer
    const drawOrder = [...this.nodes].sort((a, b) => b._proj.sz - a._proj.sz);
    for (const n of drawOrder){
      const p = n._proj;
      const teamRGB = n.team === 'red' ? '239,68,68'
                    : n.team === 'blue' ? '96,165,250'
                    : '212,247,69';
      // Hub is just a small anchor — the starburst satellites do the visual work.
      const baseR = (5 + 4 * p.pe) * (n._breath || 1);
      const isHot = n.state === 'thinking' || n.state === 'active';
      const isHover = n.id === this.hoverId || n.id === this.selectedId;

      // Outer aura (soft bloom) — kept tight so it doesn't drown the satellites.
      ctx.globalCompositeOperation = 'lighter';
      const auraR = baseR * (isHot ? 4.5 : isHover ? 3.6 : 2.4);
      const auraI = isHot ? 0.6 : (n.state === 'done' ? 0.25 : isHover ? 0.4 : 0.18);
      const aura = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, auraR);
      aura.addColorStop(0,   `rgba(${teamRGB},${auraI})`);
      aura.addColorStop(0.5, `rgba(${teamRGB},${auraI * 0.32})`);
      aura.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, auraR, 0, Math.PI*2); ctx.fill();

      // Inner halo
      const haloR = baseR * 1.85;
      const halo = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, haloR);
      halo.addColorStop(0,   `rgba(${teamRGB},${0.75 + n.pulse * 0.2})`);
      halo.addColorStop(0.7, `rgba(${teamRGB},0.18)`);
      halo.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, haloR, 0, Math.PI*2); ctx.fill();

      // Expanding pulse ring (active only)
      if (isHot){
        const ringT = ((t * 0.0014) + (n.x * 0.5)) % 1;
        const ringR = baseR + ringT * baseR * 2.2;
        const ringA = (1 - ringT) * 0.65;
        ctx.strokeStyle = `rgba(${teamRGB},${ringA})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, ringR, 0, Math.PI*2); ctx.stroke();

        // Activity progress arc — slow rotating neon gauge that signals "processing"
        const arcStart = (t * 0.0011) % (Math.PI * 2);
        const arcSpan = Math.PI * 1.35;
        const gaugeR = baseR + 13;
        ctx.strokeStyle = 'rgba(212,247,69,0.85)';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, gaugeR, arcStart, arcStart + arcSpan);
        ctx.stroke();
        // Tiny tracer dot at the arc tip
        const tipX = p.sx + Math.cos(arcStart + arcSpan) * gaugeR;
        const tipY = p.sy + Math.sin(arcStart + arcSpan) * gaugeR;
        const tipG = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 5);
        tipG.addColorStop(0, 'rgba(245,255,200,1)');
        tipG.addColorStop(1, 'rgba(212,247,69,0)');
        ctx.fillStyle = tipG;
        ctx.beginPath(); ctx.arc(tipX, tipY, 5, 0, Math.PI*2); ctx.fill();
        ctx.lineCap = 'butt';
      }

      // Solid core — 'source-over' for opaque, definitely-visible dot
      ctx.globalCompositeOperation = 'source-over';
      const coreRGB = n.state === 'failed' ? '239,68,68'
                    : n.state === 'done'   ? '74,222,128'
                    : teamRGB;
      // Base solid disc
      ctx.fillStyle = `rgba(${coreRGB},1)`;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, baseR, 0, Math.PI*2); ctx.fill();
      // Radial gradient for spherical depth
      const core = ctx.createRadialGradient(
        p.sx - baseR*0.35, p.sy - baseR*0.35, 0,
        p.sx, p.sy, baseR
      );
      core.addColorStop(0,   `rgba(255,255,255,${0.55 * p.pe})`);
      core.addColorStop(0.5, 'rgba(255,255,255,0)');
      core.addColorStop(1,   'rgba(0,0,0,0.25)');
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, baseR, 0, Math.PI*2); ctx.fill();
      // Thin edge ring for definition
      ctx.strokeStyle = `rgba(${coreRGB},${isHover ? 0.95 : 0.55})`;
      ctx.lineWidth = isHover ? 2 : 1;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, baseR, 0, Math.PI*2); ctx.stroke();

      n.pulse *= Math.pow(0.92, dt / 16);
      if (isHot) n.pulse = Math.max(n.pulse, 0.55);
    }

    // ===== 7. LABELS (always on — front-to-back overlap)
    ctx.globalCompositeOperation = 'source-over';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const labelOrder = [...this.nodes].sort((a, b) => a._proj.sz - b._proj.sz);
    for (const n of labelOrder){
      const p = n._proj;
      // Push label outside the entire starburst (hub + satellite radius)
      const baseR = (5 + 4 * p.pe) * (n._breath || 1);
      const satRadius = (n.state === 'idle' ? 0 : 0.32) * Math.min(this.W, this.H) * 0.34 * this.zoom * p.pe;
      const isHot = n.id === this.hoverId || n.id === this.selectedId || n.state === 'thinking';

      // Modern AI-console label: small uppercase letter-spaced
      const text = (n.name || n.id).toUpperCase();
      ctx.font = '700 10.5px "Inter",system-ui,sans-serif';
      // Manually space letters out
      const letterSpace = 1.0;
      const tw = ctx.measureText(text).width + letterSpace * (text.length - 1);
      const padX = 10, h = 20;
      const bx = p.sx - tw/2 - padX;
      const by = p.sy + baseR + satRadius + 10;
      // Pill background
      ctx.fillStyle = `rgba(11,11,11,${isHot ? 0.95 : 0.78})`;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, tw + padX*2, h, 6);
      else ctx.rect(bx, by, tw + padX*2, h);
      ctx.fill();
      const teamRGB = n.team === 'red' ? '239,68,68' : n.team === 'blue' ? '96,165,250' : '212,247,69';
      ctx.strokeStyle = isHot ? `rgba(${teamRGB},0.9)` : 'rgba(64,64,64,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Render letters with manual letter-spacing
      ctx.fillStyle = isHot ? 'rgba(255,255,255,1)' : 'rgba(163,163,163,0.95)';
      let lx = p.sx - tw/2;
      for (let i = 0; i < text.length; i++){
        const ch = text[i];
        const cw = ctx.measureText(ch).width;
        ctx.textAlign = 'left';
        ctx.fillText(ch, lx, by + 5);
        lx += cw + letterSpace;
      }
      ctx.textAlign = 'center';

      // Status chip below the label for active hubs (modern AI-console feel)
      if (n.state === 'thinking' && n.stepText){
        const sub = n.stepText.length > 36 ? n.stepText.slice(0, 33) + '…' : n.stepText;
        const subUp = sub.toUpperCase();
        ctx.font = '600 9px "JetBrains Mono",monospace';
        const stw = ctx.measureText(subUp).width;
        const sbx = p.sx - stw/2 - 8;
        const sby = by + h + 6;
        const sh = 16;
        ctx.fillStyle = 'rgba(212,247,69,0.10)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(sbx, sby, stw + 16, sh, 4);
        else ctx.rect(sbx, sby, stw + 16, sh);
        ctx.fill();
        ctx.strokeStyle = 'rgba(212,247,69,0.32)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Tiny pulsing dot prefix
        const dotA = 0.6 + 0.4 * Math.sin(t * 0.005);
        ctx.fillStyle = `rgba(212,247,69,${dotA})`;
        ctx.beginPath(); ctx.arc(sbx + 7, sby + sh/2, 2.2, 0, Math.PI*2); ctx.fill();
        // Status text
        ctx.fillStyle = 'rgba(212,247,69,0.95)';
        ctx.fillText(subUp, p.sx + 3, sby + 4);
      }
    }

    // ===== 8. ONE-SHOT BEAMS — agent-to-agent handoff (along the same axon curve)
    ctx.globalCompositeOperation = 'lighter';
    this.beams = this.beams.filter(b => {
      b.t += dt;
      const k = b.t / b.life;
      if (k >= 1) return false;
      const f = this.nodes.find(n => n.id === b.from);
      const tg = this.nodes.find(n => n.id === b.to);
      if (!f || !tg) return false;
      const fp = f._proj, tp = tg._proj;
      const c = edgeCurve(fp, tp);
      const pos = sampleBezier(fp, c, tp, k);
      const px = pos.x, py = pos.y;
      // Bright trail along curve
      ctx.strokeStyle = `rgba(220,255,140,${0.75 * (1 - k)})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(fp.sx, fp.sy);
      const STEPS = 28;
      for (let s = 1; s <= STEPS; s++){
        const tt = (s / STEPS) * k;
        const sp = sampleBezier(fp, c, tp, tt);
        ctx.lineTo(sp.x, sp.y);
      }
      ctx.stroke();
      // Multi-layer head glow
      const hg = ctx.createRadialGradient(px, py, 0, px, py, 18);
      hg.addColorStop(0,   'rgba(245,255,200,1)');
      hg.addColorStop(0.3, 'rgba(212,247,69,0.85)');
      hg.addColorStop(0.7, 'rgba(212,247,69,0.35)');
      hg.addColorStop(1,   'rgba(212,247,69,0)');
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI*2); ctx.fill();
      return true;
    });

    // ===== 9. DOM popover follows selected node
    this._positionPop();
  }
}
window.Constellation = Constellation;

function ico(name,opts){
  const p=ICO_PATHS[name];
  if(!p)return '';
  const cls=opts?.cls||'ico';
  const stroke=opts?.stroke||'currentColor';
  const sw=opts?.sw||2;
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function sevBadge(level){
  const map={
    critical:{ic:'alert-octagon',l:'Critical'},
    high:{ic:'alert-triangle',l:'High'},
    medium:{ic:'info',l:'Medium'},
    low:{ic:'info',l:'Low'},
    info:{ic:'info',l:'Info'},
  };
  const m=map[String(level||'info').toLowerCase()]||map.info;
  return `<span class="sev sev-${String(level||'info').toLowerCase()}">${ico(m.ic,{cls:'ico-sm'})}<span>${m.l}</span></span>`;
}

async function agentOpenPR(i){
  const repo=(($('ag-pr-repo-'+i)||{}).value||'').trim(),path=(($('ag-pr-path-'+i)||{}).value||'').trim(),token=(($('ag-pr-token-'+i)||{}).value||'').trim(),content=AG_PATCHED[i],out=$('ag-pr-out-'+i);

function copyPatched(i){

async function defLoad() {

      ? systems.map((s) => `
        <div class="crd" style="margin:8px 0">

          </button>
          <button class="btn" onclick="defStream('${s.id}')">Watch live</button>
        </div>`).join('')
      : '<em>No systems connected yet.</em>';

async function defConnect() {
  const origin = $('def-origin').value.trim();
  const out = $('def-connect-out');
  out.innerHTML = '<span class="sp"></span> Connecting…';
  try {
    const r = await api('/defender/connect', { method: 'POST', body: JSON.stringify({ origin }) });
    out.innerHTML = `<p>Connected in <b>monitor-only</b> mode. Route traffic through
      <code>${H(r.proxyUrl)}</code>, then switch to Enforce when you're ready to block.</p>`;
    defLoad();
    defStream(r.id);
  } catch (e) {
    out.innerHTML = e.status === 403
      ? '<span class="err">You must verify ownership of that domain first (Domains page).</span>'
      : `<span class="err">${H(e.message || 'connect failed')}</span>`;
  }
}

async function defToggleMode(id, mode) {
  if (mode === 'enforce' && !confirm('Enforce mode will BLOCK requests Shannon confirms as attacks. Continue?')) return;
  await api(`/defender/${id}/mode`, { method: 'POST', body: JSON.stringify({ mode }) });
  defLoad();
}

function defStream(id) {
  if (DEF_EVT) { DEF_EVT.close(); DEF_EVT = null; }
  DEF_ID = id;
  const live = $('def-live');
  live.innerHTML = '<em>Listening…</em>';
  DEF_EVT = new EventSource(`/api/defender/${id}/events`);
  DEF_EVT.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.type === 'hello') return;
    if (d.type === 'mode') { defLoad(); return; }
    if (live.querySelector('em')) live.innerHTML = '';
    const row = document.createElement('div');
    row.innerHTML = `<code>${H(d.event.method)} ${H(d.event.url)}</code> —
      <b>${H(d.verdict.cls || 'benign')}</b> — ${H(d.result.action)}${d.result.enforced ? ' <b>(blocked)</b>' : ''}`;
    live.prepend(row);
  };
}

function animateCounter(el){
  const target=parseFloat(el.dataset.target||'0');
  const isMoney=el.classList.contains('counter-money');
  const dur=900;const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const e=1-Math.pow(1-t,3); // ease-out cubic
    const v=target*e;
    el.textContent=isMoney?('$'+v.toFixed(2)):Math.round(v).toString();
    if(t<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderCharts(){
  const labels=SCANS.map(s=>host(s.target)).reverse();
  const costs=SCANS.map(s=>s.totalCost).reverse();
  const agents=SCANS.map(s=>s.agents).reverse();
  // Build gradient fills tied to canvas dimensions
  const mkGrad=(ctx,h,c1,c2)=>{const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,c1);g.addColorStop(1,c2);return g};
  const cfg=(unit)=>({
    responsive:true,maintainAspectRatio:true,
    animation:{duration:900,easing:'easeOutCubic'},
    plugins:{
      legend:{display:false},
      tooltip:{
        backgroundColor:'rgba(21,16,11,.95)',titleColor:'#ffffff',bodyColor:'#e2d2b3',
        borderColor:'rgba(212,247,69,.25)',borderWidth:1,padding:10,
        titleFont:{family:'Inter',weight:600,size:12},
        bodyFont:{family:'JetBrains Mono',size:11},
        cornerRadius:8,displayColors:false,
        callbacks:{label:c=>unit==='$'?`$${c.parsed.y.toFixed(4)}`:`${c.parsed.y} ${unit}`}
      }
    },
    scales:{
      x:{grid:{color:'rgba(255,255,255,.03)',drawTicks:false},ticks:{color:'#737373',font:{family:'Inter',size:10},maxRotation:0,autoSkip:true}},
      y:{grid:{color:'rgba(255,255,255,.04)',drawTicks:false},ticks:{color:'#737373',font:{family:'Inter',size:10},padding:8},border:{display:false}}
    }
  });
  const cCost=$('chCost'),cAg=$('chAgents');
  if(cCost){
    const ctx=cCost.getContext('2d');
    const grad=mkGrad(ctx,cCost.height,'rgba(212,247,69,.65)','rgba(212,247,69,.05)');
    new Chart(cCost,{type:'bar',data:{labels,datasets:[{data:costs,backgroundColor:grad,borderColor:'#d4f745',borderWidth:1.2,borderRadius:8,hoverBackgroundColor:'rgba(232,144,114,.85)'}]},options:cfg('$')});
  }
  if(cAg){
    const ctx=cAg.getContext('2d');
    const grad=mkGrad(ctx,cAg.height,'rgba(74,222,128,.6)','rgba(74,222,128,.05)');
    new Chart(cAg,{type:'bar',data:{labels,datasets:[{data:agents,backgroundColor:grad,borderColor:'#4ade80',borderWidth:1.2,borderRadius:8,hoverBackgroundColor:'rgba(168,197,152,.85)'}]},options:cfg('agents')});
  }
}

    const at=$('atype');if(at)at.onchange=e=>{$('afields').style.display=e.target.value!=='none'?'block':'none'};
  }
  if(WIZ_STEP===1){const t=$('turl');if(t)t.focus();loadVerifyBanner();}
}

let WIZ={};
function wizCollect(){
  if(WIZ_STEP===1){
    WIZ.targetUrl=$('turl')?.value.trim()||'';
    WIZ.retryPreset=$('rpreset')?.value||'default';
  }else if(WIZ_STEP===2){
    WIZ.authType=$('atype')?.value||'none';
    WIZ.username=$('auser')?.value||'';
    WIZ.password=$('apass')?.value||'';
    WIZ.focusUrls=$('furls')?.value||'';
    WIZ.avoidUrls=$('aurls')?.value||'';
    WIZ.acLoginUrl=$('acLoginUrl')?.value||'';
    WIZ.acAuser=$('acAuser')?.value||'';WIZ.acApass=$('acApass')?.value||'';WIZ.acAck=$('acAck')?.value||'';
    WIZ.acBuser=$('acBuser')?.value||'';WIZ.acBpass=$('acBpass')?.value||'';WIZ.acBck=$('acBck')?.value||'';
    WIZ.acAdmUser=$('acAdmUser')?.value||'';WIZ.acAdmPass=$('acAdmPass')?.value||'';WIZ.acAdmCk=$('acAdmCk')?.value||'';
  }else{
    WIZ.warRoom=$('warroom-toggle')?.checked!==false;
    WIZ.monitor=$('mon-toggle')?.checked===true;
    WIZ.alertWebhook=$('mon-webhook')?.value||'';
    WIZ.networkScan=$('net-toggle')?.checked===true;
    WIZ.networkAuthorized=$('net-auth')?.checked===true;
  }
}
function wizNext(){
  wizCollect();
  if(WIZ_STEP===1&&!WIZ.targetUrl){const t=$('turl');if(t){t.focus();t.style.borderColor='var(--red)';setTimeout(()=>t.style.borderColor='',1600)}return}
  if(WIZ_STEP<3){WIZ_STEP++;wizRender()}
}
function wizBack(){wizCollect();if(WIZ_STEP>1){WIZ_STEP--;wizRender()}}

async function doScan(){
  // Read final-step toggle then commit everything from WIZ.
  wizCollect();
  if(!WIZ.targetUrl){WIZ_STEP=1;wizRender();return}
  let keys=csLoadKeys();
  if(!keys.claude){
    const k=await promptForAnthropicKey('Anthropic API key required to launch a pentest.');
    if(!k)return;
    keys=csLoadKeys();
  }
  // Authorization gate: active scanning of a system you don't control is illegal. For external
  // targets, require an explicit attestation before launching (the server also enforces this).
  const tgtHost=(()=>{try{return new URL(WIZ.targetUrl).hostname.toLowerCase()}catch{return ''}})();
  const isLocal=tgtHost==='localhost'||/^127\./.test(tgtHost)||tgtHost==='::1'||tgtHost.endsWith('.local');
  let authorized=true;
  if(!isLocal){ authorized=await authorizeModal(WIZ.targetUrl); if(!authorized) return; }
  const b=$('gobtn');if(b){b.disabled=true;b.innerHTML='<span class="sp"></span> Starting…'}
  const reenable=()=>{if(b){b.disabled=false;b.textContent='▶ Launch Scan'}};
  try{
    const r=await api('/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      targetUrl:WIZ.targetUrl,
      authType:WIZ.authType||'none',
      username:WIZ.username,password:WIZ.password,
      retryPreset:WIZ.retryPreset||'default',
      focusUrls:WIZ.focusUrls,avoidUrls:WIZ.avoidUrls,
      apiKey:keys.claude,
      warRoom:WIZ.warRoom!==false,
      providerKeys:keys,
      authorized,
      accessControl:(()=>{const lu=(WIZ.acLoginUrl||'').trim();const mk=(label,role,user,pass,ck)=>{user=(user||'').trim();ck=(ck||'').trim();if(lu&&user)return{label,role,loginUrl:lu,username:user,password:(pass||'').trim()};if(ck)return{label,role,cookie:ck};return null;};const ids=[mk('userA','user',WIZ.acAuser,WIZ.acApass,WIZ.acAck),mk('userB','user',WIZ.acBuser,WIZ.acBpass,WIZ.acBck),mk('admin','admin',WIZ.acAdmUser,WIZ.acAdmPass,WIZ.acAdmCk)].filter(Boolean);return ids.length>=2?{identities:ids}:undefined})(),
      monitor:WIZ.monitor===true,
      alertWebhook:(WIZ.alertWebhook||'').trim()||undefined,
      networkScan:WIZ.networkScan===true,
      networkAuthorized:WIZ.networkAuthorized===true,
    })});
    if(r.error){
      // Server says we must prove we own the domain → open the verification flow, then let them retry.
      if(r.needsVerification){ reenable(); await verifyModal(r.needsVerification); return; }
      alert(r.error); reenable(); return;
    }
    WIZ={};go('live',r.scanId);
  }catch(e){alert(e.message);reenable();}
}

// Domain-ownership verification flow — proves the user controls the domain before scans are allowed.
async function verifyModal(domain){
  let info;
  try{ info=await api('/verify/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain})}); }
  catch(e){ alert('Could not start verification: '+e.message); return; }
  if(info.error){ alert(info.error); return; }
  return new Promise(resolve=>{
    const m=info.methods;
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto';
    ov.innerHTML=`
      <div style="background:linear-gradient(180deg,var(--s1),var(--bg2));border:1px solid var(--brd);border-radius:18px;padding:26px;max-width:560px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5)">

        <p style="font-size:12.5px;color:var(--t2);line-height:1.6;margin-bottom:14px">Prove you control this domain using <strong>any one</strong> method, then click Verify.</p>
        <div style="font-size:12px;color:var(--t1);font-weight:700;margin-bottom:4px">Option A — DNS TXT record</div>
        <code style="display:block;background:var(--s2);padding:8px 10px;border-radius:8px;color:var(--acc3);font-size:11px;margin-bottom:12px;word-break:break-all">${H(m.dns.record)}  TXT  ${H(m.dns.value)}</code>
        <div style="font-size:12px;color:var(--t1);font-weight:700;margin-bottom:4px">Option B — file at your web root</div>
        <code style="display:block;background:var(--s2);padding:8px 10px;border-radius:8px;color:var(--acc3);font-size:11px;margin-bottom:2px;word-break:break-all">${H(m.file.url)}</code>
        <code style="display:block;background:var(--s2);padding:8px 10px;border-radius:8px;color:var(--t2);font-size:11px;margin-bottom:12px;word-break:break-all">contents: ${H(m.file.content)}</code>
        <div style="font-size:12px;color:var(--t1);font-weight:700;margin-bottom:4px">Option C — homepage meta tag</div>
        <code style="display:block;background:var(--s2);padding:8px 10px;border-radius:8px;color:var(--acc3);font-size:11px;margin-bottom:14px;word-break:break-all">${H(m.meta.tag)}</code>
        <div id="vf-status" style="font-size:12px;min-height:16px;margin-bottom:10px"></div>
        <div style="display:flex;gap:10px">
          <button id="vf-close" class="btn btn-g" style="flex:1">Close</button>
          <button id="vf-check" class="btn btn-p" style="flex:1">Verify now</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const st=ov.querySelector('#vf-status');
    const close=()=>{ov.remove();resolve()};
    ov.querySelector('#vf-close').onclick=close;
    ov.querySelector('#vf-check').onclick=async()=>{
      st.style.color='var(--t3)';st.textContent='Checking DNS / file / meta…';
      try{
        const r=await api('/verify/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:info.domain})});
        if(r.verified){st.style.color='var(--grn)';st.textContent='✅ Verified via '+r.method+'. You can launch the scan now.';setTimeout(close,1600);}

      }catch(e){st.style.color='var(--red)';st.textContent='Error: '+e.message;}
    };
  });
}

          <div class="arena-bar-wrap"><div class="arena-bar-red" id="rt-bar" style="width:50%"></div></div>
        </div>
        <div class="arena-mid">
          <div class="arena-vs">VS</div>
          <div class="arena-mid-status" id="arena-mid-status">Engaging…</div>
        </div>
        <div class="arena-side blue">
          <div class="arena-team">
            <div class="arena-team-icon bt">BT</div>
            <div><h4>Blue Team</h4><div class="role">Defensive Analyst</div></div>
          </div>
          <div class="arena-score" id="bt-score">0</div>
          <div class="arena-score-label">Defenses Held</div>
          <div class="arena-bar-wrap"><div class="arena-bar-blue" id="bt-bar" style="width:50%"></div></div>
        </div>
      </div>
      <div class="arena-log" id="arena-log"></div>
      <div class="arena-verdict" id="arena-verdict"><div class="arena-verdict-icon"><span id="verdict-icon">?</span></div><div id="verdict-text"></div></div>
    </div>

    <details style="margin-top:20px">
      <summary style="cursor:pointer;font-size:12px;color:var(--t3);padding:10px 14px;background:var(--s1);border:1px solid var(--brd);border-radius:var(--rs);display:inline-block;user-select:none">Raw output stream</summary>
      <div class="term" id="lv-out" aria-live="polite" style="margin-top:10px">Initializing…</div>
    </details>
  </div>`;

  // Constellation graph — bilateral brain layout: red (offense) on the left
  // hemisphere, blue (defense) on the right, recon at the frontal lobe and
  // synthesis at the occipital lobe. Each phase gets an explicit 3D position
  // chosen for an organic brain silhouette and clean label spacing.
  if (window._constelNew) { try { window._constelNew.destroy(); } catch {} window._constelNew = null; }
  // Wider spread — fills the bigger canvas without bunching. Each value
  // 1.25× the previous compact layout so starbursts have room to breathe.
  const BRAIN_POS = {
    'http-recon':     { x:  0.00, y: -1.05, z:  0.40 },
    'pre-recon':      { x: -0.60, y: -0.80, z:  0.05 },
    'recon':          { x:  0.60, y: -0.80, z:  0.05 },
    'red-team':       { x: -1.15, y: -0.10, z:  0.05 },
    'blue-team':      { x:  1.15, y: -0.10, z:  0.05 },
    'exploit-verify': { x:  0.00, y:  0.00, z: -0.70 },
    'chain':          { x: -0.70, y:  0.62, z:  0.25 },
    'war-room':       { x:  0.00, y:  0.80, z:  0.40 },
    'report':         { x:  0.70, y:  0.62, z:  0.25 },
    'forensic':       { x:  0.00, y:  1.05, z: -0.25 },
  };
  const constelAgents = PHASES.map((p, i) => {
    const pos = BRAIN_POS[p.id] || (() => {
      // Fallback for unknown phases — distribute on a ring
      const ang = (i / PHASES.length) * Math.PI * 2;
      return { x: Math.cos(ang) * 0.7, y: 0, z: Math.sin(ang) * 0.7 };
    })();
    return {
      id: p.id, name: p.name, team: p.team || null, role: p.role || '',
      x: pos.x, y: pos.y, z: pos.z,
    };
  });
  // GraphRAG-style typed edges. Each edge carries a relationship label that
  // gets rendered along the line — same look as Neo4j Browser / Cosma /
  // mirofish knowledge-graph viewers.
  const constelEdges = [
    // Recon pipeline
    ['http-recon','pre-recon',     'FEEDS_DATA'],
    ['pre-recon','recon',          'EXTENDS'],
    ['http-recon','recon',         'COMPLEMENTS'],
    // Recon → combat (hemisphere projections)
    ['recon','red-team',           'TARGETS'],
    ['recon','blue-team',          'INFORMS'],
    ['pre-recon','red-team',       'PRIMES'],
    ['pre-recon','blue-team',      'PRIMES'],
    // The "corpus callosum" red↔blue
    ['red-team','blue-team',       'OPPOSES'],
    // Combat → verification
    ['red-team','exploit-verify',  'VERIFIES'],
    ['blue-team','exploit-verify', 'VALIDATES'],
    // Synthesis lobe
    ['exploit-verify','chain',     'DOCUMENTS'],
    ['exploit-verify','war-room',  'TRIGGERS'],
    ['chain','war-room',           'REVIEWED_BY'],
    ['war-room','report',          'PRODUCES'],
    ['report','forensic',          'ARCHIVED_BY'],
    ['chain','forensic',           'EVIDENCE_FOR'],
    ['war-room','forensic',        'AUDITED_BY'],
    // Long-range projections
    ['red-team','chain',           'CONTRIBUTES_TO'],
    ['blue-team','report',         'INFORMS'],
  ];

  const initConstelNew = () => {
    const host = $('constel-new');
    if (!host) { console.warn('Constellation: host #constel-new not found'); return; }
    try {
      window._constelNew = new Constellation(host, {
        agents: constelAgents,
        edges: constelEdges,
        onSelect: () => {},
      });
    } catch (e) { console.error('Constellation New Scan init failed:', e); }
  };
  requestAnimationFrame(() => setTimeout(initConstelNew, 0));

  // SSE
  EVT=new EventSource('/api/scans/'+sid+'/events');
  EVT.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==='phase')handlePhaseStart(d);
    else if(d.type==='phase-done')handlePhaseDone(d);
    else if(d.type==='output')handleOutput(d.line||'');
    else if(d.type==='complete'||d.type==='failed'||d.type==='stopped')handleEnd(d.type);
  };

  POLL=setInterval(()=>{
    const elapsed=(Date.now()-LIVE.startedAt)/1000|0;
    const el=$('lv-t');if(el)el.textContent=elapsed+'s';
    // Constellation HUD widgets
    const hu=$('hud-uptime'); if(hu) hu.textContent = elapsed<60?elapsed+'s':Math.floor(elapsed/60)+'m '+(elapsed%60)+'s';
    const hc=$('hud-cost');   if(hc) hc.textContent = '$'+LIVE.totalCost.toFixed(2);
    const ha=$('hud-active'); if(ha){
      const active=Object.values(LIVE.phaseState).filter(s=>s.status==='active').length;
      ha.textContent=active;
    }
    const hd=$('hud-done');   if(hd){
      const done=Object.values(LIVE.phaseState).filter(s=>s.status==='done').length;
      hd.textContent=done;
    }
    // Update drawer if open
    if(LIVE.drawerPhase)refreshDrawer();
  },800);
}

function handlePhaseStart(d){
  // Mark prior current phase as done if not already
  const phase=PHASES.find(p=>p.id===d.phase);if(!phase)return;
  LIVE.currentPhase=d.phase;
  const st=LIVE.phaseState[d.phase];
  st.status='active';st.startedAt=Date.now();
  // UI
  const el=$('pl-'+d.phase);if(el)el.className=`planet active${phase.team?' team-'+phase.team:''}`;
  $('lv-p').textContent=d.name;
  // Phase Stepper sync
  const ps=$('ps-'+d.phase);if(ps){ps.classList.remove('failed');ps.classList.add('active')}
  pulseBeam(d.phase);
  try{ window._constelNew?.setState(d.phase, 'thinking'); window._constelNew?.setStep(d.phase, d.name + ' agent activated'); }catch{}
  pushLog(d.phase,'phase',d.name+' agent activated');
  st.thinking='Starting reconnaissance and tool selection…';
  // Arena trigger
  if(phase.team==='red'||phase.team==='blue'){
    enterArena(d.phase);
  } else {
    leaveArena();
  }
}

function handlePhaseDone(d){
  const phase=PHASES.find(p=>p.id===d.phase);if(!phase)return;
  const st=LIVE.phaseState[d.phase];
  st.status='done';st.endedAt=Date.now();st.duration=d.duration;st.cost=d.cost;
  if(d.cost){LIVE.totalCost+=d.cost;$('lv-c').textContent='$'+LIVE.totalCost.toFixed(4)}
  const el=$('pl-'+d.phase);if(el)el.className=`planet done`;
  // Phase Stepper sync
  const ps=$('ps-'+d.phase);if(ps){ps.classList.remove('active');ps.classList.add('done')}
  const meta=[];if(d.duration)meta.push(d.duration.toFixed(1)+'s');if(d.cost)meta.push('$'+d.cost.toFixed(3));
  const pm=$('pm-'+d.phase);if(pm)pm.textContent=meta.join(' · ');
  const cnt=document.querySelectorAll('.planet.done').length;
  $('lv-a').textContent=cnt+' / '+PHASES.length;
  pushLog(d.phase,'done','Agent completed'+(meta.length?' ('+meta.join(' · ')+')':''));
  st.thinking='Completed.';
  if(phase.team==='red'||phase.team==='blue'){settleArena()}
  try{
    window._constelNew?.setState(d.phase, 'done');
    const meta=[]; if(d.duration) meta.push(d.duration.toFixed(1)+'s'); if(d.cost) meta.push('$'+d.cost.toFixed(3));
    if (meta.length) window._constelNew?.setStep(d.phase, 'completed · ' + meta.join(' · '));
  }catch{}
  hideBeam();
}

/* humanizeLine — translate raw worker stdout/stderr into plain-English activity
   the user can actually read. Returns null for noise (stack traces, file paths,
   JSON bracket dumps, ANSI residue). For known errors it returns a friendly
   one-liner instead of a 30-line stack. Drives the constellation popover. */
function humanizeLine(raw){
  if (!raw) return null;
  const t = String(raw).replace(/\x1b\[[0-9;]*m/g, '').replace(/\r/g, '').trim();
  if (!t || t.length < 2) return null;

  // ----- SKIP NOISE -----
  if (/^[=\-_*]{3,}$/.test(t))                                    return null;
  if (/^\s*\^+\s*$/.test(t))                                      return null;
  if (/^\{[^}]*$|^[\s\}\]"',]+$/.test(t))                         return null;
  if (/file:\/\/|node_modules[\\/]|\.(m?js|c?js|ts):\d+/i.test(t)) return null;
  if (/^\s*at\s+\S+\s+\(/.test(t))                                return null;
  if (/^\s*(throw new|return new)\s/.test(t))                     return null;
  if (/^Node\.js v\d/.test(t))                                    return null;
  if (/^node:internal|^node:[a-z]/.test(t))                       return null;
  if (/^\s*errno:|^\s*code:|^\s*syscall:/i.test(t))               return null;
  if (/^\s*"[a-z_]+"\s*:/i.test(t))                               return null;

  // ----- HUMANIZE KNOWN ERRORS -----
  if (/invalid x-api-key|authentication_error|HTTP 401|AuthenticationError|invalid api key|invalid_api_key/i.test(t))
    return { kind: 'err', text: 'Anthropic API key is invalid — fix it in Settings' };
  if (/BadRequestError.*(?:invalid_request|model_not_found)/i.test(t))
    return { kind: 'err', text: 'Anthropic rejected the request — wrong model name or bad input' };
  if (/RateLimitError|HTTP 429|rate.?limit/i.test(t))
    return { kind: 'err', text: 'Hit the Anthropic rate limit — wait a minute and retry' };
  if (/PermissionDeniedError|HTTP 403/i.test(t))
    return { kind: 'err', text: 'API access forbidden — check your Anthropic plan' };
  if (/ECONNREFUSED|ETIMEDOUT|ENOTFOUND|getaddrinfo|fetch failed/i.test(t))
    return { kind: 'err', text: 'Network error — could not reach the target' };
  if (/BadRequestError|HTTP 400/i.test(t))
    return { kind: 'err', text: 'Bad request sent to the LLM' };
  const errM = t.match(/^[A-Za-z]*Error:\s*(.{4,160})/);
  if (errM) return { kind: 'err', text: errM[1].replace(/\{.*$/, '').trim() };

  // ----- PHASE MARKERS -----
  const phaseM = t.match(/^\[Phase\s*\d+\]\s*(.+)/i);
  if (phaseM) return { kind: 'phase', text: phaseM[1].replace(/\.{2,}$/, '').trim() };

  // ----- ACTION VERBS (read fine as-is) -----
  if (/^(Starting|Scanning|Analyzing|Crawling|Testing|Probing|Sending|Discovered|Loading|Saving|Found|Detecting|Hardening|Verifying|Validating|Building|Generating|Calling|Running|Waiting|Connecting|Fetching|Parsing|Indexing|Preparing|Drafting|Patching|Reviewing|Synthesizing)\b/i.test(t))
    return { kind: 'info', text: t.length > 140 ? t.slice(0, 137) + '…' : t };

  // ----- DONE / SUCCESS -----
  if (/^(Done|Completed|Success|Finished|✓)\b/i.test(t))
    return { kind: 'ok', text: t.length > 140 ? t.slice(0, 137) + '…' : t };

  // ----- DEFAULT: keep only short, non-bracketed lines with letters in them -----
  if (t.length < 180 && !/[{}<>]{3,}/.test(t) && /[a-zA-Z]/.test(t))
    return { kind: 'info', text: t };

  return null;
}

function handleOutput(line){
  if(!line||!line.trim())return;
  const t=$('lv-out');if(t){t.textContent+=line+'\n';t.scrollTop=t.scrollHeight}
  const phaseId=LIVE.currentPhase||'http-recon';
  const txt=line.trim();
  // Categorize for the raw-output stream
  let kind='info';
  if(/\b(error|failed|exception|denied)\b/i.test(txt))kind='err';
  else if(/\b(success|exploit|vuln|found|leaked|bypassed?|injection)\b/i.test(txt))kind='warn';
  else if(/\b(blocked|safe|secure|ok|done|completed|protected|hardened)\b/i.test(txt))kind='ok';
  pushLog(phaseId,kind,txt);
  // Push only humanized, plain-English lines to the constellation popover.
  const human = humanizeLine(txt);
  if (human){
    const prefix = human.kind === 'err'   ? '⚠ '
                 : human.kind === 'phase' ? '▸ '
                 : human.kind === 'ok'    ? '✓ '
                 : '· ';
    LIVE.phaseState[phaseId].thinking = human.text.length > 180 ? human.text.slice(0,180)+'…' : human.text;
    try{
      window._constelNew?.appendOutput(phaseId, prefix + human.text);
      // Promote phase markers + errors into the headline so the popover
      // subtitle always reflects what the agent is doing right now.
      if (human.kind === 'phase' || human.kind === 'err'){
        window._constelNew?.setStep(phaseId, human.text);
      }
    }catch{}
  }
  // Arena: feed events
  if(LIVE.arena.mode){feedArena(phaseId,kind,txt)}
}

function handleEnd(type){
  if(EVT){EVT.close();EVT=null}
  if(POLL){clearInterval(POLL);POLL=null}
  const labels={complete:'Complete',failed:'Failed',stopped:'Stopped'};
  const titles={complete:'Scan Complete',failed:'Scan Failed',stopped:'Scan Stopped'};
  const colors={complete:'var(--grn)',failed:'var(--red)',stopped:'var(--ylw)'};
  $('lv-s').textContent=labels[type];$('lv-s').style.color=colors[type];$('lv-s').removeAttribute('data-pulse');
  $('lv-p').removeAttribute('data-pulse');
  const t=$('lv-title');if(t){t.textContent=titles[type];t.style.color=colors[type]}
  const sp=$('lv-spin');if(sp)sp.style.display='none';
  const sb=$('stop-btn');if(sb)sb.style.display='none';
  // On failure/stop, mark *only the currently-active* phase as failed; leave waiting phases waiting.
  if(type==='complete'){
    PHASES.forEach(p=>{const el=$('pl-'+p.id);if(el&&!el.classList.contains('done'))el.className='planet done';
      const ps=$('ps-'+p.id);if(ps&&!ps.classList.contains('done')){ps.classList.remove('active');ps.classList.add('done')}
      if(LIVE.phaseState[p.id].status!=='done')LIVE.phaseState[p.id].status='done';
    });
  }else{
    if(LIVE.currentPhase){
      const el=$('pl-'+LIVE.currentPhase);if(el)el.className='planet';
      const ps=$('ps-'+LIVE.currentPhase);if(ps){ps.classList.remove('active');ps.classList.add('failed')}
    }
  }
  hideBeam();leaveArena(true);
  // Show the failed-state hero with helpful copy + retry CTA
  if(type==='failed'||type==='stopped'){
    const hero=$('fail-hero');if(hero){
      hero.style.display='block';
      const phaseName=LIVE.currentPhase?(PHASES.find(p=>p.id===LIVE.currentPhase)?.name||LIVE.currentPhase):'an early phase';
      const reason=type==='stopped'?'You stopped the scan manually.':`The scan errored during <strong style="color:var(--t1)">${phaseName}</strong>. Common causes: invalid Anthropic API key, rate-limit, target unreachable, or the local Securovix worker isn't running.`;
      $('fail-msg').innerHTML=reason;
      hero.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  }
  load().then(()=>{if(type==='complete')setTimeout(()=>view(window._liveSid),1800)});
}

function pushLog(phaseId,kind,text){
  const arr=LIVE.phaseLogs[phaseId];if(!arr)return;
  arr.push({t:Date.now(),kind,text});
  if(arr.length>500)arr.shift();
  if(LIVE.drawerPhase===phaseId)appendDrawerLine(kind,text);
}

// ============ BEAM ============
function pulseBeam(phaseId){
  const beam=$('beam');if(!beam)return;
  const planet=document.querySelector(`#ob-${phaseId} .planet-body`);if(!planet)return;
  const sBox=$('solar').getBoundingClientRect();
  const pBox=planet.getBoundingClientRect();
  const cx=sBox.left+sBox.width/2,cy=sBox.top+sBox.height/2;
  const px=pBox.left+pBox.width/2,py=pBox.top+pBox.height/2;
  const dx=px-cx,dy=py-cy;
  const len=Math.hypot(dx,dy);
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  beam.style.width=len+'px';
  beam.style.transform=`translate(0,-1px) rotate(${ang}deg)`;
  beam.classList.add('on');
  // Re-aim on every frame would be expensive; this is a one-shot since planets orbit slowly
  // We'll re-aim every 1.5s while phase is active
  if(window._beamInt)clearInterval(window._beamInt);
  window._beamInt=setInterval(()=>{
    if(LIVE.currentPhase!==phaseId){clearInterval(window._beamInt);return}
    const p2=document.querySelector(`#ob-${phaseId} .planet-body`);if(!p2)return;
    const b=$('solar').getBoundingClientRect(),pb=p2.getBoundingClientRect();
    const cx2=b.left+b.width/2,cy2=b.top+b.height/2;
    const px2=pb.left+pb.width/2,py2=pb.top+pb.height/2;
    const dx2=px2-cx2,dy2=py2-cy2;
    beam.style.width=Math.hypot(dx2,dy2)+'px';
    beam.style.transform=`translate(0,-1px) rotate(${Math.atan2(dy2,dx2)*180/Math.PI}deg)`;
  },140);
}
function hideBeam(){const b=$('beam');if(b)b.classList.remove('on');if(window._beamInt){clearInterval(window._beamInt);window._beamInt=null}}

// ============ ORBIT CONTROLS ============
let _speed=1,_paused=false;
function toggleOrbits(){
  _paused=!_paused;
  document.querySelectorAll('.orbiter').forEach(o=>o.classList.toggle('paused',_paused));
  const b=$('tool-pause');if(b)b.textContent=_paused?'Resume Orbits':'Pause Orbits';
  if(b)b.classList.toggle('on',_paused);
}
function speedOrbits(s){
  _speed=s;
  document.querySelectorAll('.solar-tools button').forEach(b=>{if(b.id&&b.id.startsWith('tool-1x'))return;if(b.textContent.match(/^\d/))b.classList.remove('on')});
  document.querySelectorAll('.solar-tools button').forEach(b=>{if(b.textContent===s+'×')b.classList.add('on');else if(b.textContent.match(/×$/))b.classList.remove('on')});
  document.querySelectorAll('.orbiter').forEach(o=>{
    const id=o.id.replace('ob-','');
    const phase=PHASES.find(p=>p.id===id);
    if(!phase)return;
    const dur=([48,64,84][phase.orbit])/s;
    o.style.setProperty('--dur',dur+'s');
    const planet=o.querySelector('.planet');if(planet)planet.style.animationDuration=dur+'s';
  });
}

// ============ DRAWER ============
function openDrawer(phaseId){
  const phase=PHASES.find(p=>p.id===phaseId);if(!phase)return;
  LIVE.drawerPhase=phaseId;
  const st=LIVE.phaseState[phaseId];
  const av=$('dr-av');
  av.className='drawer-av '+(st.status||'waiting')+(phase.team?' team-'+phase.team:'');
  av.textContent=phase.short;
  $('dr-name').textContent=phase.name;
  $('dr-role').textContent=phase.role+(phase.team==='red'?' · Offensive':phase.team==='blue'?' · Defensive':'');
  refreshDrawer();
  // Render full feed
  const f=$('dr-feed');f.innerHTML='';
  const logs=LIVE.phaseLogs[phaseId]||[];
  if(logs.length===0){f.innerHTML='<div class="drawer-empty">'+H(phase.desc)+'<br><br>Awaiting agent activity.</div>'}
  else logs.forEach(l=>appendDrawerLine(l.kind,l.text,l.t));
  // Show
  $('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');
  $('drawer-ov').classList.add('on');
}
function refreshDrawer(){
  if(!LIVE.drawerPhase)return;
  const phaseId=LIVE.drawerPhase;
  const phase=PHASES.find(p=>p.id===phaseId);if(!phase)return;
  const st=LIVE.phaseState[phaseId];
  const av=$('dr-av');av.className='drawer-av '+(st.status||'waiting')+(phase.team?' team-'+phase.team:'');
  $('dr-status').textContent=({waiting:'Idle',active:'Running',done:'Done'})[st.status]||'—';
  if(st.startedAt){
    const end=st.endedAt||Date.now();
    $('dr-time').textContent=((end-st.startedAt)/1000).toFixed(1)+'s';
  } else $('dr-time').textContent='—';
  $('dr-cost').textContent=st.cost?'$'+st.cost.toFixed(3):'—';
  $('dr-think').textContent=st.thinking||(st.status==='waiting'?'Awaiting activation…':st.status==='done'?'Phase completed.':'Reasoning…');
}
function appendDrawerLine(kind,text,ts){
  const f=$('dr-feed');if(!f)return;
  if(f.querySelector('.drawer-empty'))f.innerHTML='';
  const t=ts||Date.now();
  const time=new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const div=document.createElement('div');
  div.className='drawer-line '+(kind==='warn'?'warn':kind==='err'?'err':kind==='ok'||kind==='done'?'ok':'');
  div.innerHTML=`<span class="ts">${time}</span><span style="flex:1;min-width:0">${H(text.length>400?text.slice(0,400)+'…':text)}</span>`;
  f.appendChild(div);
  // Cap to last 200
  while(f.children.length>200)f.removeChild(f.firstChild);
  f.scrollTop=f.scrollHeight;
}
function closeDrawer(){
  $('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');
  $('drawer-ov').classList.remove('on');
  LIVE.drawerPhase=null;
}

// ============ ARENA ============
function enterArena(phaseId){
  // Show arena when red-team or blue-team is active. Run continuously while either is active.
  LIVE.arena.mode=phaseId;
  $('arena').classList.add('on');
  $('arena-mid-status').textContent=phaseId==='red-team'?'Red Team is probing…':'Blue Team is hardening…';
  $('arena-status').textContent='Engagement live';
  $('arena-verdict').classList.remove('on','safe','breach');
}
function leaveArena(force){
  if(!LIVE.arena.mode&&!force)return;
  // Keep arena visible after settle but mark closed
  if(force){LIVE.arena.mode=null}
}
function feedArena(phaseId,kind,txt){
  const ev={t:Date.now(),text:txt};
  const isRed=phaseId==='red-team';
  // Heuristic categorization
  if(/\b(blocked|filter|waf|denied|reject|safe|hardened|defense|patch)\b/i.test(txt)){
    ev.type='def';ev.icon='✓';ev.label='Defense';
    LIVE.arena.blueScore++;updateArenaScore();
    pushArenaEvent(ev);
  } else if(/\b(exploit|injection|leak|bypass|escalat|payload|crack|stolen|leaked|vuln(erab)?(le|ility)?)\b/i.test(txt)){
    ev.type='atk';ev.icon='!';ev.label='Attack';
    LIVE.arena.redScore++;updateArenaScore();
    pushArenaEvent(ev);
  } else if(/\bcritical\b/i.test(txt)){
    ev.type='crit';ev.icon='*';ev.label='Critical';
    pushArenaEvent(ev);
  }
}
function pushArenaEvent(ev){
  LIVE.arena.events.push(ev);
  const log=$('arena-log');if(!log)return;
  const div=document.createElement('div');
  div.className='arena-event '+ev.type;
  const time=new Date(ev.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  div.innerHTML=`<div class="arena-event-icon">${ev.icon}</div><div class="arena-event-text"><strong>${ev.label}:</strong> ${H(ev.text.length>180?ev.text.slice(0,180)+'…':ev.text)}</div><div class="arena-event-time">${time}</div>`;
  log.appendChild(div);
  while(log.children.length>40)log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}
function updateArenaScore(){
  $('rt-score').textContent=LIVE.arena.redScore;
  $('bt-score').textContent=LIVE.arena.blueScore;
  const total=LIVE.arena.redScore+LIVE.arena.blueScore||1;
  const rPct=Math.round(100*LIVE.arena.redScore/total);
  $('rt-bar').style.width=rPct+'%';
  $('bt-bar').style.width=(100-rPct)+'%';
}
function settleArena(){
  // Only render verdict once both red and blue completed (or scan ends)
  const redDone=LIVE.phaseState['red-team']?.status==='done';
  const blueDone=LIVE.phaseState['blue-team']?.status==='done';
  if(!(redDone&&blueDone))return;
  const r=LIVE.arena.redScore,b=LIVE.arena.blueScore;
  const v=$('arena-verdict'),vt=$('verdict-text'),vi=$('verdict-icon');
  if(b>r){
    v.classList.remove('breach');v.classList.add('on','safe');
    vi.textContent='✓';
    vt.innerHTML=`<strong>Verdict: Defended.</strong> Blue Team held the line. ${b} defenses · ${r} successful exploits. Posture: defensible.`;
    $('arena-mid-status').textContent='Blue holds';
  } else if(r>b){
    v.classList.remove('safe');v.classList.add('on','breach');
    vi.textContent='!';
    vt.innerHTML=`<strong>Verdict: Breach.</strong> Red Team broke through. ${r} successful exploits · ${b} defenses. Posture: vulnerable — see report.`;
    $('arena-mid-status').textContent='Red breaks through';
  } else {
    v.classList.add('on');
    v.style.background='var(--ylw-bg)';v.style.color='var(--ylw)';
    vi.textContent='~';
    vt.innerHTML=`<strong>Verdict: Stalemate.</strong> Even contest. ${r} exploits vs ${b} defenses. Manual review recommended.`;
    $('arena-mid-status').textContent='Stalemate';
  }
  $('arena-status').textContent='Engagement closed';
}

// ===== ATTACK CHAIN GRAPH =====
function renderChainGraph(){
  // Build a simple DAG from chain analysis or vuln categories
  const rb=window._rb;
  // Per-category worst severity + whether any finding there is CONFIRMED, from the breakdown
  // (not file presence — every category writes an analysis doc even when it finds nothing).
  const order={crit:0,high:1,med:2,low:3,info:4};
  const sevMap={};
  for(const it of rb.list){
    const cur=sevMap[it.cat];
    if(!cur||order[it.sev]<order[cur.sev])sevMap[it.cat]={sev:it.sev,confirmed:cur?cur.confirmed:false};
    if(it.conf==='confirmed')sevMap[it.cat]={...(sevMap[it.cat]||{sev:it.sev}),confirmed:true};
  }
  const conf=c=>!!(sevMap[c]&&sevMap[c].confirmed);
  const cats=['sqli','xss','auth-bypass','authz-bypass','ssrf','business-logic','misconfig','info-disclosure'];
  const present=cats.filter(c=>sevMap[c]); // only categories with ACTUAL findings

  // Layout nodes in 3 columns: Recon → Vulns → Impact
  const reconNodes=[{id:'recon',label:'Recon',col:0,row:0}];
  const vulnNodes=present.map((c,i)=>({id:'v-'+c,label:c,col:1,row:i,sev:sevMap[c].sev}));
  const impactNodes=[
    {id:'data',label:'Data Loss',col:2,row:0,sev:conf('sqli')||conf('ssrf')?'crit':(sevMap['sqli']||sevMap['ssrf'])?'med':'low'},
    {id:'auth',label:'Account Takeover',col:2,row:1,sev:conf('auth-bypass')||conf('xss')?'crit':(sevMap['auth-bypass']||sevMap['xss'])?'med':'low'},
    {id:'priv',label:'Privilege Escalation',col:2,row:2,sev:conf('authz-bypass')?'high':sevMap['authz-bypass']?'med':'low'},
  ];
  const nodes=[...reconNodes,...vulnNodes,...impactNodes];

  // Edges
  const edges=[];
  vulnNodes.forEach(v=>edges.push({from:'recon',to:v.id}));
  vulnNodes.forEach(v=>{
    if(v.label.includes('sqli')||v.label.includes('ssrf'))edges.push({from:v.id,to:'data'});
    if(v.label.includes('auth-bypass')||v.label.includes('xss'))edges.push({from:v.id,to:'auth'});
    if(v.label.includes('authz-bypass'))edges.push({from:v.id,to:'priv'});
    if(v.label.includes('misconfig'))edges.push({from:v.id,to:'data'});
  });

  const W=800,H=360;
  const cols=3,colW=W/cols;
  const layout={};nodes.forEach(n=>{
    const colNodes=nodes.filter(x=>x.col===n.col);
    const rowH=H/(colNodes.length+1);
    layout[n.id]={x:colW*n.col+colW/2,y:rowH*(n.row+1)};
  });
  const sevColor={crit:'#ef4444',high:'#ddff5e',med:'#d4a04a',low:'#6a9bc4'};

  $('TP').innerHTML=`<div style="animation:rvIn .3s var(--med)">
    <h3 class="h-display" style="font-size:20px;margin-bottom:6px;color:var(--t0)">Attack Chain Graph</h3>
    <p style="color:var(--t2);margin-bottom:18px;font-size:13px">From reconnaissance to vulnerability to business impact. Node color reflects exploitability.</p>
    <div class="chain-graph">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="rgba(212,247,69,.6)"/>
          </marker>
        </defs>
        ${edges.map(e=>{const a=layout[e.from],b=layout[e.to];return `<path d="M${a.x+30},${a.y} C${(a.x+b.x)/2},${a.y} ${(a.x+b.x)/2},${b.y} ${b.x-30},${b.y}" stroke="rgba(212,247,69,.35)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>`}).join('')}
        ${nodes.map(n=>{const p=layout[n.id];const col=n.sev?sevColor[n.sev]:'#d4f745';return `
          <g transform="translate(${p.x},${p.y})">
            <rect x="-60" y="-22" width="120" height="44" rx="10" fill="${col}22" stroke="${col}" stroke-width="1.5"/>
            <text text-anchor="middle" y="-2" font-family="Inter" font-weight="700" font-size="13" fill="#ffffff">${n.label}</text>
            <text text-anchor="middle" y="14" font-family="Inter" font-size="9" fill="#a3a3a3">${n.col===0?'phase':n.col===1?'vulnerability':'impact'}</text>
          </g>`}).join('')}
      </svg>
    </div>
    <p style="font-size:11.5px;color:var(--t3);margin-top:14px;font-family:'JetBrains Mono',monospace">${nodes.length} nodes · ${edges.length} edges · ${present.length} vulnerability categories</p>
  </div>`;
}
