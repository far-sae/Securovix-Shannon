<!DOCTYPE html>
<html lang="en" style="color-scheme:dark;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#15100b">
<title>Securovix &mdash; Penetration Testing</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/components.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
/* Tokens live in /tokens.css — this :root only adds late-loaded overrides if needed. */
html,body{background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;color:var(--t0);min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;touch-action:manipulation;
background:radial-gradient(1200px 700px at 85% -10%,rgba(212,247,69,.04),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(212,247,69,.025),transparent 60%),var(--bg);background-attachment:fixed}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:264px;background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);border-right:1px solid var(--brd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;flex-shrink:0;backdrop-filter:saturate(1.1)}
.main{flex:1;overflow-y:auto;position:relative}

/* Logo */
.logo{padding:22px 22px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;border-radius:50%;display:block;background:url('/favicon.png') center/cover no-repeat;box-shadow:0 0 26px rgba(212,247,69,.42);animation:logoPulse 3.4s ease-in-out infinite;flex-shrink:0}
@keyframes logoPulse{0%,100%{box-shadow:0 0 22px rgba(212,247,69,.32),inset 0 1px 0 rgba(255,255,255,.18)}50%{box-shadow:0 0 38px rgba(212,247,69,.55),inset 0 1px 0 rgba(255,255,255,.25)}}
.logo h1{font-family:'Inter',system-ui,sans-serif;font-size:20px;font-weight:700;letter-spacing:-.4px;color:var(--t0)}
.logo span{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:1.8px;font-weight:600}

/* Nav */
.nav{padding:14px 12px}
.nav button{width:100%;padding:11px 14px;border:none;border-radius:var(--rs);cursor:pointer;color:var(--t2);font:500 13px/1 'Inter',sans-serif;background:0;display:flex;align-items:center;gap:10px;transition:background var(--fast),color var(--fast),transform var(--fast);margin-bottom:3px}
.nav button:hover{background:var(--s3);color:var(--t0)}
.nav button:active{transform:scale(.97)}
.nav button.on{background:var(--glow);color:var(--acc2);box-shadow:inset 0 0 0 1px rgba(212,247,69,.22)}
.nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.slist{padding:10px 12px;border-top:1px solid var(--brd);overflow-y:auto;flex:1}
.slist-h{font-size:9.5px;text-transform:uppercase;color:var(--t3);padding:10px 14px 12px;letter-spacing:1.8px;font-weight:700}
.sitem{padding:11px 14px;border-radius:var(--rs);cursor:pointer;margin-bottom:3px;transition:background var(--fast);border:1px solid transparent}
.sitem:hover{background:var(--s3)}
.sitem.on{background:var(--glow);border-color:rgba(212,247,69,.18)}
.sitem .st{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t0)}
.sitem .sm{font-size:11px;color:var(--t3);margin-top:4px;display:flex;align-items:center;gap:6px}

/* Page */
.pg{padding:44px 48px;max-width:1280px;animation:pgIn .45s var(--med)}
@keyframes pgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.h-display{font-family:'Inter',system-ui,sans-serif;font-weight:700;letter-spacing:-.6px}

/* Badge */
.bx{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.bx::before{content:'';width:6px;height:6px;border-radius:50%}
.bx-g{background:var(--grn-bg);color:var(--grn)}.bx-g::before{background:var(--grn)}
.bx-r{background:var(--red-bg);color:var(--red)}.bx-r::before{background:var(--red)}
.bx-b{background:var(--blu-bg);color:var(--blu)}.bx-b::before{background:var(--blu);animation:pdot 1.8s ease-in-out infinite}
.bx-y{background:var(--ylw-bg);color:var(--ylw)}.bx-y::before{background:var(--ylw)}
.bx-o{background:var(--glow);color:var(--acc2)}.bx-o::before{background:var(--acc);animation:pdot 1.6s ease-in-out infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px}
.crd{background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 100%);border:1px solid var(--brd);border-radius:var(--r);padding:22px 24px;transition:border-color var(--fast),transform var(--fast),box-shadow var(--fast);position:relative;overflow:hidden}
.crd::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
.crd::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--glow2),transparent 70%);opacity:0;transition:opacity var(--fast);pointer-events:none}
.crd:hover{border-color:var(--brd2);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.crd:hover::after{opacity:1}
.crd:nth-child(1){animation:cIn .55s var(--med) .05s backwards}
.crd:nth-child(2){animation:cIn .55s var(--med) .12s backwards}
.crd:nth-child(3){animation:cIn .55s var(--med) .19s backwards}
.crd:nth-child(4){animation:cIn .55s var(--med) .26s backwards}
.crd:nth-child(5){animation:cIn .55s var(--med) .33s backwards}
@keyframes cIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.crd-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.crd-v{font-family:'Inter',system-ui,sans-serif;font-size:32px;font-weight:700;margin-top:6px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;color:var(--t0)}

/* Buttons */
.btn{padding:11px 22px;border:none;border-radius:var(--rs);font:600 13px/1 'Inter',sans-serif;cursor:pointer;transition:transform var(--fast),box-shadow var(--fast),background var(--fast);display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc-deep));color:#0b0b0b;box-shadow:0 4px 18px rgba(212,247,69,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-p:hover{box-shadow:0 8px 28px rgba(212,247,69,.5),inset 0 1px 0 rgba(255,255,255,.18);transform:translateY(-1px)}
.btn-p:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-g{background:var(--s2);color:var(--t1);border:1px solid var(--brd2)}
.btn-g:hover{background:var(--s3);color:var(--t0);border-color:var(--brd3)}

/* Form */
.fg{margin-bottom:20px}
.fg label{display:block;font-size:10.5px;font-weight:700;margin-bottom:7px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px}
.fi{width:100%;padding:12px 14px;background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--rs);color:var(--t0);font:400 14px/1.4 'Inter',sans-serif;outline:0;transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}
.fi:hover{border-color:var(--brd3)}
.fi:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow);background:var(--s1)}
.fi::placeholder{color:var(--t4)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ============ SOLAR SYSTEM ============ */
.solar-wrap{
  position:relative;margin:28px 0;
  background:radial-gradient(900px 500px at 50% 50%,rgba(212,247,69,.06),transparent 70%),linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);
  border:1px solid var(--brd);border-radius:20px;overflow:hidden;
  box-shadow:0 14px 56px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
}
.solar-wrap::before{
  content:'';position:absolute;inset:0;background-image:
    radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.22),transparent 50%),
    radial-gradient(1px 1px at 17% 78%,rgba(255,255,255,.16),transparent 50%),
    radial-gradient(1px 1px at 28% 38%,rgba(255,255,255,.12),transparent 50%),
    radial-gradient(1px 1px at 45% 88%,rgba(255,255,255,.18),transparent 50%),
    radial-gradient(1px 1px at 62% 14%,rgba(255,255,255,.14),transparent 50%),
    radial-gradient(1.5px 1.5px at 73% 58%,rgba(255,255,255,.2),transparent 50%),
    radial-gradient(1px 1px at 84% 32%,rgba(255,255,255,.16),transparent 50%),
    radial-gradient(1px 1px at 92% 80%,rgba(255,255,255,.14),transparent 50%),
    radial-gradient(1px 1px at 5% 50%,rgba(255,255,255,.1),transparent 50%);
  pointer-events:none;animation:starDrift 80s linear infinite;
}
@keyframes starDrift{0%{transform:translateY(0)}100%{transform:translateY(-40px)}}

.solar-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 0;position:relative;z-index:5;flex-wrap:wrap;gap:12px}
.solar-head h3{font-family:'Inter',system-ui,sans-serif;font-size:20px;font-weight:600;letter-spacing:-.3px;color:var(--t0);display:flex;align-items:center;gap:10px}
.solar-head h3::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc);animation:pdot 1.6s ease-in-out infinite}
.solar-tools{display:flex;gap:8px}
.solar-tools button{background:var(--s2);border:1px solid var(--brd2);color:var(--t2);padding:6px 12px;border-radius:8px;font:600 10.5px 'Inter',sans-serif;cursor:pointer;transition:all var(--fast);text-transform:uppercase;letter-spacing:.5px}
.solar-tools button:hover{color:var(--t0);background:var(--s3);border-color:var(--brd3)}
.solar-tools button.on{color:var(--acc2);background:var(--glow);border-color:rgba(212,247,69,.3)}

.solar{position:relative;height:560px;margin:8px 0 0;z-index:1;perspective:1200px}
.solar svg.orbits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.orbit-path{fill:none;stroke:rgba(212,247,69,.12);stroke-width:1;stroke-dasharray:2,4;transition:stroke .5s,stroke-width .5s}
.orbit-path.active{stroke:rgba(212,247,69,.32);stroke-width:1.2;stroke-dasharray:none}

/* Sun core */
.sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:108px;height:108px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff5e8,var(--acc3) 25%,var(--acc) 55%,var(--acc-deep) 100%);
  display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:36px;color:#0b0b0b;
  box-shadow:0 0 50px rgba(212,247,69,.6),0 0 110px rgba(212,247,69,.35),inset 0 2px 0 rgba(255,255,255,.3);
  z-index:6;animation:sunBreathe 4s ease-in-out infinite;cursor:pointer;
}
.sun::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(212,247,69,.3);animation:coreRing1 3s ease-in-out infinite}
.sun::after{content:'';position:absolute;inset:-28px;border-radius:50%;border:1px solid rgba(212,247,69,.18);animation:coreRing2 4.5s ease-in-out infinite}
@keyframes sunBreathe{0%,100%{box-shadow:0 0 50px rgba(212,247,69,.6),0 0 110px rgba(212,247,69,.35),inset 0 2px 0 rgba(255,255,255,.3)}50%{box-shadow:0 0 70px rgba(212,247,69,.78),0 0 150px rgba(212,247,69,.45),inset 0 2px 0 rgba(255,255,255,.4)}}
@keyframes coreRing1{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.25);opacity:.1}}
@keyframes coreRing2{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.35);opacity:.05}}

/* Orbiters */
.orbiter{position:absolute;left:50%;top:50%;width:0;height:0;animation:spin var(--dur,40s) linear infinite;transform:rotate(var(--start,0deg));z-index:3}
.orbiter.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(calc(var(--start,0deg) + 360deg))}}
.planet-pos{position:absolute;transform:translate(var(--r),0);will-change:transform}

.planet{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;animation:counter var(--dur,40s) linear infinite;animation-direction:reverse;
}
.orbiter.paused .planet{animation-play-state:paused}
@keyframes counter{to{transform:translate(-50%,-50%) rotate(-360deg)}}
.planet-body{
  width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:13px;
  border:1.5px solid var(--brd2);background:var(--s2);color:var(--t3);
  transition:all .55s cubic-bezier(.16,1,.3,1);position:relative;
}
.planet-body::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid transparent;transition:border-color .5s}
.planet.waiting .planet-body{background:var(--s2);color:var(--t3);border-color:var(--brd2)}
.planet.active .planet-body{
  background:radial-gradient(circle at 30% 30%,var(--acc2),var(--acc) 60%,var(--acc-deep));
  color:#0b0b0b;border-color:rgba(255,255,255,.3);
  box-shadow:0 0 28px rgba(212,247,69,.6),inset 0 1px 0 rgba(255,255,255,.25);
  animation:planetPulse 1.6s ease-in-out infinite;
}
.planet.active .planet-body::before{border-color:rgba(212,247,69,.5);animation:planetRing 1.8s ease-in-out infinite}
.planet.done .planet-body{background:radial-gradient(circle at 30% 30%,#86efac,var(--grn) 60%,#16a34a);color:#0b0b0b;border-color:rgba(74,222,128,.4);box-shadow:0 0 14px rgba(74,222,128,.32)}
.planet.team-red .planet-body{background:radial-gradient(circle at 30% 30%,#ff8888,var(--rt) 55%,#a02020);box-shadow:0 0 28px var(--rt-glow),inset 0 1px 0 rgba(255,255,255,.2)}
.planet.team-blue .planet-body{background:radial-gradient(circle at 30% 30%,#7ab8ff,var(--bt) 55%,#1e3a8a);box-shadow:0 0 28px var(--bt-glow),inset 0 1px 0 rgba(255,255,255,.2)}
@keyframes planetPulse{0%,100%{box-shadow:0 0 26px rgba(212,247,69,.55),inset 0 1px 0 rgba(255,255,255,.25)}50%{box-shadow:0 0 46px rgba(212,247,69,.85),inset 0 1px 0 rgba(255,255,255,.35)}}
@keyframes planetRing{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.4);opacity:0}}
.planet-label{font-size:9.5px;font-weight:600;color:var(--t2);text-align:center;max-width:90px;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.6);background:rgba(21,16,11,.6);padding:2px 7px;border-radius:6px;white-space:nowrap;backdrop-filter:blur(2px)}
.planet.active .planet-label{color:var(--acc2);font-weight:700;background:rgba(21,16,11,.75);box-shadow:0 0 0 1px rgba(212,247,69,.3)}
.planet.done .planet-label{color:var(--grn);background:rgba(21,16,11,.6)}
.planet-meta{font-size:8.5px;color:var(--t3);font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;background:rgba(21,16,11,.5);padding:1px 6px;border-radius:4px;min-height:11px}

/* Energy beam from sun to active planet */
.beam{position:absolute;left:50%;top:50%;transform-origin:0 50%;height:2px;background:linear-gradient(90deg,var(--acc),transparent);pointer-events:none;opacity:0;transition:opacity .4s;z-index:2}
.beam.on{opacity:.7;animation:beamFlow 2s linear infinite}
@keyframes beamFlow{0%{background:linear-gradient(90deg,var(--acc),transparent 60%)}50%{background:linear-gradient(90deg,var(--acc-deep),var(--acc) 30%,transparent 80%)}100%{background:linear-gradient(90deg,var(--acc),transparent 60%)}}

/* Solar footer */
.solar-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 18px;position:relative;z-index:5;font-size:11.5px;color:var(--t2);flex-wrap:wrap;gap:10px}
.solar-foot .legend{display:flex;gap:14px;font-size:10.5px}
.solar-foot .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--t3)}
.solar-foot .legend span::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--brd3)}
.solar-foot .legend .lg-active::before{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.solar-foot .legend .lg-done::before{background:var(--grn)}
.solar-foot .legend .lg-rt::before{background:var(--rt);box-shadow:0 0 8px var(--rt)}
.solar-foot .legend .lg-bt::before{background:var(--bt);box-shadow:0 0 8px var(--bt)}

/* ============ AGENT DRAWER ============ */
.drawer{
  position:fixed;top:0;right:0;width:min(480px,92vw);height:100vh;
  background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);
  border-left:1px solid var(--brd2);box-shadow:-20px 0 60px rgba(0,0,0,.5);
  transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);
  z-index:120;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-h{padding:22px 24px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:flex-start;gap:14px}
.drawer-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:18px;color:#0b0b0b;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.drawer-av.waiting{background:linear-gradient(135deg,#54453a,#3a2c22);color:var(--t3)}
.drawer-av.active{background:radial-gradient(circle at 30% 30%,var(--acc2),var(--acc) 55%,var(--acc-deep));animation:planetPulse 1.6s ease-in-out infinite}
.drawer-av.done{background:radial-gradient(circle at 30% 30%,#86efac,var(--grn) 55%,#16a34a)}
.drawer-av.team-red{background:radial-gradient(circle at 30% 30%,#ff8888,var(--rt) 55%,#a02020)}
.drawer-av.team-blue{background:radial-gradient(circle at 30% 30%,#7ab8ff,var(--bt) 55%,#1e3a8a)}
.drawer-h h2{font-family:'Inter',system-ui,sans-serif;font-size:22px;font-weight:700;color:var(--t0);letter-spacing:-.3px}
.drawer-h .role{font-size:11px;color:var(--t3);margin-top:3px;text-transform:uppercase;letter-spacing:1px}
.drawer-close{margin-left:auto;background:0;border:none;color:var(--t3);cursor:pointer;font-size:20px;padding:4px 8px;border-radius:6px;transition:all var(--fast)}
.drawer-close:hover{color:var(--t0);background:var(--s3)}
.drawer-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 24px;border-bottom:1px solid var(--brd)}
.drawer-stat{background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:10px 12px}
.drawer-stat .l{font-size:9px;text-transform:uppercase;color:var(--t3);letter-spacing:.8px;font-weight:700}
.drawer-stat .v{font-family:'Inter',system-ui,sans-serif;font-size:18px;font-weight:700;color:var(--t0);margin-top:3px;font-variant-numeric:tabular-nums}
.drawer-thinking{padding:14px 24px;border-bottom:1px solid var(--brd);background:var(--bg2)}
.drawer-thinking .lbl{font-size:10px;text-transform:uppercase;color:var(--t3);letter-spacing:.8px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.drawer-thinking .lbl::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pdot 1.5s ease-in-out infinite}
.drawer-thinking .txt{font:13px/1.5 'JetBrains Mono',monospace;color:var(--t1);min-height:18px;word-break:break-word}
.drawer-feed{flex:1;overflow-y:auto;padding:14px 24px;display:flex;flex-direction:column;gap:8px}
.drawer-feed::-webkit-scrollbar{width:8px}
.drawer-feed::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}
.drawer-line{display:flex;gap:10px;font:12px/1.5 'JetBrains Mono',monospace;color:var(--t1);padding:6px 10px;background:var(--s2);border:1px solid var(--brd);border-radius:6px;animation:bIn .3s cubic-bezier(.16,1,.3,1)}
.drawer-line.warn{border-color:rgba(212,160,74,.3);color:#e8c576}
.drawer-line.err{border-color:rgba(239,68,68,.3);color:var(--red)}
.drawer-line.ok{border-color:rgba(74,222,128,.3);color:var(--grn)}
.drawer-line .ts{color:var(--t4);font-size:10px;flex-shrink:0;font-weight:500}
.drawer-empty{text-align:center;padding:50px 20px;color:var(--t3);font-size:13px}

.drawer-overlay{position:fixed;inset:0;background:rgba(15,11,7,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:115}
.drawer-overlay.on{opacity:1;pointer-events:auto}

/* ============ RED VS BLUE ARENA ============ */
.arena{
  margin:24px 0;
  background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(96,165,250,.06));
  border:1px solid var(--brd);border-radius:18px;overflow:hidden;
  display:none;
  animation:bIn .55s cubic-bezier(.16,1,.3,1);
}
.arena.on{display:block}
.arena-h{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd);flex-wrap:wrap;gap:10px}
.arena-h h3{font-family:'Inter',system-ui,sans-serif;font-size:19px;font-weight:600;color:var(--t0);letter-spacing:-.3px}
.arena-status{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t2)}
.arena-status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pdot 1.4s ease-in-out infinite}
.arena-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0}
.arena-side{padding:22px 24px;position:relative}
.arena-side.red{border-right:1px solid var(--brd)}
.arena-team{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.arena-team-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:18px;color:#0b0b0b;box-shadow:0 0 20px var(--rt-glow);animation:planetPulse 1.8s ease-in-out infinite}
.arena-team-icon.bt{background:radial-gradient(circle at 30% 30%,#7ab8ff,var(--bt) 55%,#1e3a8a);box-shadow:0 0 20px var(--bt-glow)}
.arena-team-icon.rt{background:radial-gradient(circle at 30% 30%,#ff8888,var(--rt) 55%,#a02020)}
.arena-team h4{font-family:'Inter',system-ui,sans-serif;font-size:16px;font-weight:700;letter-spacing:-.2px}
.arena-team .role{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.arena-side.red .arena-team h4{color:var(--rt)}
.arena-side.blue .arena-team h4{color:var(--bt)}
.arena-score{font-family:'Inter',system-ui,sans-serif;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;line-height:1;margin-bottom:4px}
.arena-side.red .arena-score{color:var(--rt)}
.arena-side.blue .arena-score{color:var(--bt)}
.arena-score-label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.arena-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 18px;border-right:1px solid var(--brd);background:var(--bg2);min-width:140px}
.arena-vs{font-family:'Inter',system-ui,sans-serif;font-size:32px;font-weight:800;color:var(--t1);letter-spacing:-1px}
.arena-mid-status{font-size:11px;color:var(--t2);margin-top:6px;text-align:center;line-height:1.3}
.arena-bar-wrap{margin-top:14px;height:6px;background:var(--s2);border-radius:3px;overflow:hidden;position:relative;border:1px solid var(--brd);width:100%}
.arena-bar-red{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--rt) 0%,#ff8888 100%);transition:width .6s cubic-bezier(.16,1,.3,1);box-shadow:0 0 12px var(--rt-glow)}
.arena-bar-blue{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(270deg,var(--bt) 0%,#7ab8ff 100%);transition:width .6s cubic-bezier(.16,1,.3,1);box-shadow:0 0 12px var(--bt-glow)}
.arena-log{padding:0 24px 22px;max-height:280px;overflow-y:auto}
.arena-log::-webkit-scrollbar{width:8px}
.arena-log::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}
.arena-event{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--s2);border:1px solid var(--brd);margin-top:8px;font-size:12.5px;animation:bIn .3s cubic-bezier(.16,1,.3,1)}
.arena-event.atk{border-color:rgba(239,68,68,.3);background:linear-gradient(90deg,rgba(239,68,68,.08),var(--s2) 60%)}
.arena-event.def{border-color:rgba(96,165,250,.3);background:linear-gradient(270deg,rgba(96,165,250,.08),var(--s2) 60%)}
.arena-event.crit{border-color:rgba(212,160,74,.32);background:linear-gradient(90deg,rgba(212,160,74,.1),var(--s2) 60%)}
.arena-event-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0b0b0b;flex-shrink:0;font-family:'Inter',system-ui,sans-serif}
.arena-event.atk .arena-event-icon{background:var(--rt)}
.arena-event.def .arena-event-icon{background:var(--bt)}
.arena-event.crit .arena-event-icon{background:var(--ylw)}
.arena-event-text{flex:1;color:var(--t1)}
.arena-event-text strong{color:var(--t0);font-weight:700}
.arena-event-time{font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace;flex-shrink:0}

/* Verdict banner */
.arena-verdict{padding:14px 24px;border-top:1px solid var(--brd);font-size:13px;display:none;align-items:center;gap:12px}
.arena-verdict.on{display:flex}
.arena-verdict.safe{background:var(--grn-bg);color:var(--grn);border-top-color:rgba(74,222,128,.3)}
.arena-verdict.breach{background:var(--red-bg);color:var(--red);border-top-color:rgba(239,68,68,.3)}
.arena-verdict-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b0b0b;background:currentColor;flex-shrink:0}
.arena-verdict-icon span{color:var(--bg);font-size:13px}

/* Battle SVG between teams */
.arena-battle-svg{position:absolute;left:0;right:0;top:50%;height:80px;transform:translateY(-50%);pointer-events:none;z-index:1}

/* Terminal */
.term{background:#0e0a06;border:1px solid var(--brd);border-radius:var(--r);padding:20px 22px;font:400 12.5px/1.65 'JetBrains Mono',monospace;color:#c2a373;white-space:pre-wrap;max-height:380px;overflow-y:auto;overscroll-behavior:contain;box-shadow:inset 0 1px 0 rgba(0,0,0,.4)}
.term::-webkit-scrollbar{width:8px}
.term::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--brd);margin-bottom:24px;overflow-x:auto}
.tab{padding:12px 18px;cursor:pointer;font-size:12px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent;transition:color var(--fast),border-color var(--fast);white-space:nowrap;user-select:none}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--acc2);border-bottom-color:var(--acc)}

/* Report */
.rv{background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);border:1px solid var(--brd);border-radius:var(--r);padding:44px 52px;line-height:1.8;font-size:14.5px;animation:rvIn .4s var(--med);box-shadow:0 12px 48px rgba(0,0,0,.4);color:var(--t1)}
@keyframes rvIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rv h1{font-family:'Inter',system-ui,sans-serif;font-size:30px;font-weight:700;margin:28px 0 12px;letter-spacing:-.6px;color:var(--t0);text-wrap:balance}
.rv h2{font-family:'Inter',system-ui,sans-serif;font-size:22px;font-weight:600;margin:34px 0 14px;color:var(--acc2);border-bottom:1px solid var(--brd);padding-bottom:10px;letter-spacing:-.3px}
.rv h3{font-family:'Inter',system-ui,sans-serif;font-size:17px;font-weight:600;margin:24px 0 8px;color:var(--cyn)}
.rv h4{font-size:14.5px;font-weight:700;margin:18px 0 8px;color:var(--t0)}
.rv p{margin-bottom:14px}
.rv strong{color:var(--t0)}
.rv ul,.rv ol{margin:8px 0 16px 26px}
.rv li{margin-bottom:6px}
.rv code{background:var(--s3);padding:2px 7px;border-radius:var(--rxs);font:12.5px 'JetBrains Mono',monospace;color:var(--acc3)}
.rv pre{background:var(--bg);border:1px solid var(--brd);border-radius:var(--rs);padding:18px 22px;overflow-x:auto;margin:14px 0}
.rv pre code{background:0;padding:0;color:#c2a373}
.rv table{width:100%;border-collapse:collapse;margin:18px 0}
.rv th,.rv td{padding:11px 15px;border:1px solid var(--brd);text-align:left;font-size:13px}
.rv th{background:var(--s3);font-weight:700;color:var(--t0)}
.rv blockquote{border-left:3px solid var(--acc);padding:14px 22px;margin:18px 0;background:var(--glow2);border-radius:0 var(--rs) var(--rs) 0;color:var(--t1)}

/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
.chart-box{background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);border:1px solid var(--brd);border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.chart-box h3{font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:600;color:var(--t1);margin-bottom:12px;letter-spacing:-.2px}
.chart-box canvas{max-height:240px!important;width:100%!important;height:auto!important}

/* Risk widgets (results page) */
.risk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}
.risk-card{background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);border:1px solid var(--brd);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.risk-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.risk-card.crit::before{background:var(--red)}
.risk-card.high::before{background:#ddff5e}
.risk-card.med::before{background:var(--ylw)}
.risk-card.low::before{background:var(--blu)}
.risk-card.info::before{background:var(--t3)}
.risk-card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.risk-card-cat{font-size:10px;text-transform:uppercase;color:var(--t3);letter-spacing:.8px;font-weight:700}
.risk-card-sev{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:2px 8px;border-radius:10px}
.risk-card-sev.crit{background:var(--red-bg);color:var(--red)}
.risk-card-sev.high{background:rgba(232,144,114,.16);color:#ddff5e}
.risk-card-sev.med{background:var(--ylw-bg);color:var(--ylw)}
.risk-card-sev.low{background:var(--blu-bg);color:var(--blu)}
.risk-card-sev.info{background:var(--s3);color:var(--t2)}
.risk-card-name{font-family:'Inter',system-ui,sans-serif;font-size:17px;font-weight:600;color:var(--t0);letter-spacing:-.2px;margin-bottom:8px}
.risk-card-meta{display:flex;gap:14px;font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace}

/* Posture gauge */
.posture-grid{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);border:1px solid var(--brd);border-radius:var(--r);padding:26px;margin:20px 0}
.gauge{position:relative;width:160px;height:160px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-bg{fill:none;stroke:var(--s3);stroke-width:12}
.gauge-fg{fill:none;stroke-linecap:round;stroke-width:12;transition:stroke-dasharray 1.2s cubic-bezier(.16,1,.3,1),stroke 1.2s}
.gauge-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gauge-num .v{font-family:'Inter',system-ui,sans-serif;font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.gauge-num .l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-top:3px;font-weight:600}

/* Attack chain graph */
.chain-graph{background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);border:1px solid var(--brd);border-radius:var(--r);padding:20px;height:380px;position:relative;overflow:hidden}
.chain-graph svg{width:100%;height:100%}

/* Table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:11px 18px;text-align:left;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--brd)}
.tbl td{padding:14px 18px;border-bottom:1px solid var(--brd);font-size:13px;color:var(--t1)}
.tbl tr{transition:background var(--fast);cursor:pointer}
.tbl tr:hover{background:var(--s2)}

/* Spinner */
.sp{display:inline-block;width:16px;height:16px;border:2px solid var(--brd2);border-top-color:var(--acc);border-radius:50%;animation:spin360 .65s linear infinite}
.sp-l{width:24px;height:24px;border-width:2.5px}
@keyframes spin360{to{transform:rotate(360deg)}}

/* Empty */
.empty{text-align:center;padding:110px 20px;animation:pgIn .55s var(--med)}
.empty-ico{width:88px;height:88px;margin:0 auto 22px;background:radial-gradient(circle at 30% 30%,rgba(240,179,148,.18),rgba(212,247,69,.06) 60%,transparent);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 0 60px rgba(212,247,69,.18)}
.empty h2{font-family:'Inter',system-ui,sans-serif;font-size:26px;font-weight:700;color:var(--t0);margin-bottom:8px;letter-spacing:-.4px}
.empty p{color:var(--t3);font-size:14px;max-width:360px;margin:0 auto 28px;line-height:1.6}

@keyframes bIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

@media(max-width:920px){
  .solar{height:480px}
  .sun{width:84px;height:84px;font-size:30px}
  .planet-body{width:42px;height:42px;font-size:11px}
  .pg{padding:28px 20px}
  .arena-grid{grid-template-columns:1fr;gap:0}
  .arena-side.red{border-right:none;border-bottom:1px solid var(--brd)}
  .arena-mid{border-right:none;border-bottom:1px solid var(--brd);padding:14px}
  .drawer-stats{grid-template-columns:repeat(2,1fr)}
  .cs-grid{grid-template-columns:1fr!important}
  .cs-arena{grid-template-columns:1fr!important}
}

/* ===== Code Scan multi-agent ===== */
.cs-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
.cs-drop{position:relative;border:1.5px dashed var(--brd2);border-radius:12px;padding:0;background:var(--bg);transition:all var(--fast);overflow:hidden}
.cs-drop.drag{border-color:var(--acc);background:var(--glow2)}
.cs-drop textarea{width:100%;height:380px;background:transparent;border:none;outline:0;resize:vertical;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.55;color:var(--t1);white-space:pre}
.cs-drop-hint{position:absolute;bottom:8px;right:10px;font-size:10.5px;color:var(--t3);pointer-events:none;background:rgba(21,16,11,.7);padding:3px 8px;border-radius:6px;backdrop-filter:blur(2px)}
.cs-toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cs-fname{padding:6px 10px!important;font-size:12px!important;width:auto!important;min-width:130px;font-family:'JetBrains Mono',monospace}

.cs-arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cs-team-col{background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%);border:1px solid var(--brd);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.cs-team-col.red{border-color:rgba(239,68,68,.25)}
.cs-team-col.red::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rt),transparent)}
.cs-team-col.blue{border-color:rgba(96,165,250,.25)}
.cs-team-col.blue::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--bt),transparent)}
.cs-team-h{display:flex;align-items:center;gap:8px;font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:700;margin-bottom:12px;letter-spacing:.2px}
.cs-team-h.red{color:var(--rt)}
.cs-team-h.blue{color:var(--bt)}
.cs-team-h::before{content:'';width:8px;height:8px;border-radius:50%;}
.cs-team-h.red::before{background:var(--rt);box-shadow:0 0 10px var(--rt-glow)}
.cs-team-h.blue::before{background:var(--bt);box-shadow:0 0 10px var(--bt-glow)}

.cs-agent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--brd);margin-bottom:8px;transition:all var(--med);position:relative;overflow:hidden}
.cs-agent.thinking{border-color:rgba(212,247,69,.4);box-shadow:0 0 0 1px rgba(212,247,69,.18),0 0 18px rgba(212,247,69,.18)}
.cs-agent.done{border-color:rgba(74,222,128,.3);background:linear-gradient(180deg,var(--bg2),rgba(74,222,128,.04))}
.cs-agent.failed{border-color:rgba(239,68,68,.4);background:linear-gradient(180deg,var(--bg2),rgba(239,68,68,.05))}
.cs-agent::after{content:'';position:absolute;left:-30%;top:0;height:100%;width:30%;background:linear-gradient(90deg,transparent,rgba(212,247,69,.2),transparent);opacity:0;transition:opacity var(--fast)}
.cs-agent.thinking::after{opacity:1;animation:csShim 1.6s linear infinite}
@keyframes csShim{0%{left:-30%}100%{left:120%}}
.cs-av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:14px;color:#0b0b0b;flex-shrink:0;border:1px solid rgba(255,255,255,.08)}
.cs-av.r1{background:radial-gradient(circle at 30% 30%,#ff8888,var(--rt) 60%,#a02020)}
.cs-av.r2{background:radial-gradient(circle at 30% 30%,#3ec795,#10a37f 60%,#0a6e55)}
.cs-av.b1{background:radial-gradient(circle at 30% 30%,#7ab8ff,var(--bt) 60%,#1e3a8a)}
.cs-av.b2{background:radial-gradient(circle at 30% 30%,#aacfc4,#88b3a8 60%,#557b73)}
.cs-agent.thinking .cs-av{animation:csPulse 1.4s ease-in-out infinite}
@keyframes csPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(212,247,69,.6)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(212,247,69,0)}}
.cs-aname{font-size:12.5px;font-weight:700;color:var(--t0);line-height:1.2}
.cs-arole{font-size:10.5px;color:var(--t3);margin-top:2px;line-height:1.3}
.cs-stat{margin-left:auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--t3);padding:3px 8px;border-radius:20px;background:var(--s3);flex-shrink:0}
.cs-agent.thinking .cs-stat{color:var(--acc2);background:var(--glow)}
.cs-agent.done .cs-stat{color:var(--grn);background:var(--grn-bg)}
.cs-agent.failed .cs-stat{color:var(--red);background:var(--red-bg)}

.cs-link{position:relative;height:38px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.cs-link.active{color:var(--acc2)}
.cs-link::before,.cs-link::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brd2),transparent);margin:0 10px}

.cs-trans{background:var(--bg);border:1px solid var(--brd);border-radius:14px;padding:14px;max-height:520px;overflow-y:auto}
.cs-turn{padding:12px 14px;border:1px solid var(--brd);border-radius:10px;margin-bottom:10px;background:var(--s1);position:relative;animation:csIn .4s var(--med) backwards}
.cs-turn.red{border-left:3px solid var(--rt)}
.cs-turn.blue{border-left:3px solid var(--bt)}
@keyframes csIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cs-turn-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cs-turn-h .cs-av{width:24px;height:24px;font-size:11px;border-radius:6px}
.cs-turn-name{font-size:12px;font-weight:700;color:var(--t0)}
.cs-turn-step{font-size:10.5px;color:var(--t3)}
.cs-turn-text{font-size:12.5px;color:var(--t1);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cs-turn-text pre,.cs-turn-text code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:8px 10px;overflow-x:auto;display:block;margin:6px 0;white-space:pre}

.cs-tabs{display:flex;gap:4px;border-bottom:1px solid var(--brd);margin-bottom:14px;overflow-x:auto}
.cs-tab{background:0;border:0;color:var(--t3);padding:10px 16px;font:600 12px 'Inter',sans-serif;cursor:pointer;border-bottom:2px solid transparent;transition:all var(--fast);white-space:nowrap}
.cs-tab:hover{color:var(--t1)}
.cs-tab.on{color:var(--acc2);border-bottom-color:var(--acc)}

.cs-rep{font-size:13.5px;color:var(--t1);line-height:1.7}
.cs-rep h1,.cs-rep h2,.cs-rep h3{font-family:'Inter',system-ui,sans-serif;color:var(--t0);margin:18px 0 10px;letter-spacing:-.2px}
.cs-rep h1{font-size:22px}.cs-rep h2{font-size:17px;border-bottom:1px solid var(--brd);padding-bottom:6px}.cs-rep h3{font-size:14px;color:var(--acc2)}
.cs-rep code{background:var(--bg2);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2)}
.cs-rep pre{background:var(--bg);border:1px solid var(--brd);padding:12px;border-radius:8px;overflow-x:auto}
.cs-rep ul,.cs-rep ol{padding-left:22px;margin:8px 0}
.cs-rep li{margin:4px 0}
.cs-rep blockquote{border-left:3px solid var(--brd2);padding-left:14px;color:var(--t2);margin:10px 0}
.cs-rep table{border-collapse:collapse;margin:10px 0;width:100%}
.cs-rep th,.cs-rep td{border:1px solid var(--brd);padding:6px 10px;text-align:left;font-size:12.5px}
.cs-rep th{background:var(--s2);color:var(--t0)}

/* ---------- Settings page redesign ---------- */
.set-hero{position:relative;padding:30px 32px 28px;border-radius:18px;border:1px solid var(--brd);background:
  radial-gradient(800px 220px at 0% 0%,rgba(212,247,69,.10),transparent 60%),
  radial-gradient(600px 200px at 100% 100%,rgba(184,138,157,.07),transparent 60%),
  linear-gradient(180deg,var(--s1),var(--bg2));
  overflow:hidden;margin-bottom:20px}
.set-hero::before{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,transparent 0%,transparent 60%,rgba(212,247,69,.06) 100%);pointer-events:none}
.set-hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc2);margin-bottom:10px}
.set-hero-eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.set-hero h1{font-family:'Inter',system-ui,sans-serif;font-size:32px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px;color:var(--t0)}
.set-hero p{color:var(--t2);font-size:13.5px;line-height:1.6;max-width:580px}
.set-hero-meter{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.set-hero-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--brd2);font-size:11.5px;color:var(--t1);font-weight:500}
.set-hero-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px rgba(74,222,128,.6)}
.set-hero-pill.warn .dot{background:var(--ylw);box-shadow:0 0 8px rgba(212,160,74,.6)}
.set-hero-pill.muted .dot{background:var(--t3);box-shadow:none}

.set-section{padding:24px 28px;margin-bottom:18px;border-radius:16px;border:1px solid var(--brd);background:linear-gradient(180deg,var(--s1) 0%,var(--bg2) 100%)}
.set-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.set-section-head h3{font-family:'Inter',system-ui,sans-serif;font-size:19px;font-weight:700;color:var(--t0);letter-spacing:-.2px}
.set-section-head .sub{font-size:12.5px;color:var(--t3);margin-top:2px}
.set-section-desc{font-size:12.5px;color:var(--t2);margin:6px 0 18px;line-height:1.6;max-width:640px}

.prov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:6px}
@media (max-width:760px){.prov-grid{grid-template-columns:1fr}}

.prov-tile{position:relative;padding:18px 18px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--brd2);transition:border-color var(--fast),background var(--fast),transform var(--fast)}
.prov-tile:hover{border-color:var(--brd3);background:var(--s2)}
.prov-tile.connected{border-color:rgba(74,222,128,.32);background:linear-gradient(180deg,rgba(74,222,128,.04),var(--bg2))}
.prov-tile.required:not(.connected){border-color:rgba(212,247,69,.30);background:linear-gradient(180deg,rgba(212,247,69,.04),var(--bg2))}

.prov-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.prov-avatar{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:16px;color:#0b0b0b;flex-shrink:0;border:1px solid rgba(255,255,255,.10);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
.prov-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.2}
.prov-name{font-size:14px;font-weight:700;color:var(--t0);letter-spacing:-.1px}
.prov-status{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.prov-status .dot{width:6px;height:6px;border-radius:50%}
.prov-status.connected{background:var(--grn-bg);color:var(--grn)}
.prov-status.connected .dot{background:var(--grn);box-shadow:0 0 6px rgba(74,222,128,.7)}
.prov-status.required{background:rgba(212,247,69,.14);color:var(--acc2)}
.prov-status.required .dot{background:var(--acc);box-shadow:0 0 6px rgba(212,247,69,.6)}
.prov-status.optional{background:var(--bg);color:var(--t3)}
.prov-status.optional .dot{background:var(--t3)}
.prov-strength{font-size:11.5px;color:var(--t2);margin-top:4px;line-height:1.45}

.prov-input-wrap{position:relative}
.prov-input{width:100%;padding:11px 86px 11px 38px;background:var(--bg);border:1px solid var(--brd2);border-radius:10px;color:var(--t0);font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:none;transition:border-color var(--fast),box-shadow var(--fast)}
.prov-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.prov-input::placeholder{color:var(--t4);font-family:'JetBrains Mono',monospace}
.prov-input-key{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--t3);pointer-events:none}
.prov-icon-btn{position:absolute;top:50%;transform:translateY(-50%);background:transparent;border:1px solid var(--brd2);border-radius:8px;padding:5px 10px;font-size:10.5px;color:var(--t2);cursor:pointer;font-weight:600;letter-spacing:.3px;transition:color var(--fast),border-color var(--fast),background var(--fast)}
.prov-icon-btn:hover{color:var(--t0);border-color:var(--brd3);background:var(--s2)}
.prov-eye{right:46px}
.prov-clear{right:8px;color:var(--red)}
.prov-clear:hover{color:var(--red);border-color:rgba(239,68,68,.3);background:var(--red-bg)}

.prov-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.prov-link{font-size:11px;color:var(--t3);text-decoration:none;transition:color var(--fast)}
.prov-link:hover{color:var(--acc2)}
.prov-link::after{content:" \2192";color:var(--t4);transition:color var(--fast)}
.prov-link:hover::after{color:var(--acc2)}

.set-cta{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:linear-gradient(180deg,var(--s2),var(--bg2));border:1px solid var(--brd2);margin-top:14px}
.set-cta .lead{font-size:12.5px;color:var(--t2);flex:1}
.set-cta .lead b{color:var(--t0);font-weight:600}
.set-save-msg{font-size:12.5px;color:var(--grn);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.set-save-msg::before{content:"";display:none;width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px rgba(74,222,128,.7)}
.set-save-msg.shown::before{display:inline-block}

/* ============================================================
   DESIGN POLISH LAYER — global motion, depth, and feel
   ============================================================ */

/* Smoother global focus + selection */
*:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::selection{background:rgba(212,247,69,.3);color:var(--t0)}

/* Premium card hover — depth + glow + subtle lift */
.crd{transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .35s,background .25s}
.crd:hover{transform:translateY(-3px);border-color:var(--brd3);box-shadow:0 18px 48px rgba(0,0,0,.4),0 0 0 1px rgba(212,247,69,.15),0 0 28px rgba(212,247,69,.08)}

/* Stat-card values gently pulse when colored as accent (running, active) */
.crd-v{transition:color var(--med),text-shadow var(--med)}
.crd-v[data-pulse="1"]{animation:numPulse 2.4s ease-in-out infinite;text-shadow:0 0 22px currentColor}
@keyframes numPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

/* Primary buttons get a moving sheen on hover */
.btn-p{position:relative;overflow:hidden}
.btn-p::after{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.18),transparent);pointer-events:none;transform:skewX(-18deg);transition:left .55s cubic-bezier(.16,1,.3,1)}
.btn-p:hover::after{left:120%}

/* Sidebar nav buttons: animated underline + active glow */
.nav button{position:relative}
.nav button.on::after{content:'';position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:navUnderline 2.4s ease-in-out infinite}
@keyframes navUnderline{0%,100%{opacity:.55;transform:scaleX(.6)}50%{opacity:1;transform:scaleX(1)}}

/* Sidebar items lift slightly */
.sitem{transition:transform var(--fast),background var(--fast),border-color var(--fast)}
.sitem:hover{transform:translateX(2px)}

/* Inputs lift on focus */
.fi{transition:border-color var(--fast),box-shadow var(--fast),background var(--fast),transform var(--fast)}
.fi:focus{transform:translateY(-1px)}

/* Page entry gets a tiny scale for subtle depth */
.pg{animation:pgInPolish .55s cubic-bezier(.16,1,.3,1)}
@keyframes pgInPolish{from{opacity:0;transform:translateY(14px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Status badge pulse refinement */
.bx-o::before,.bx-b::before{animation:bxDot 1.6s ease-in-out infinite}
@keyframes bxDot{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 currentColor}50%{opacity:.4;transform:scale(.7);box-shadow:0 0 6px currentColor}}

/* Sun gets a more dramatic breathe */
.sun{filter:drop-shadow(0 0 30px rgba(212,247,69,.3))}

/* Phase Stepper — top-tier visual on the live scan page */
.phase-stepper{display:flex;align-items:stretch;gap:0;margin-bottom:22px;background:linear-gradient(180deg,var(--s1),var(--bg2));border:1px solid var(--brd);border-radius:16px;padding:14px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--brd2) transparent;position:relative}
.phase-stepper::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
.ps-item{flex:1;min-width:110px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:transform var(--fast)}
.ps-item:not(:last-child)::after{content:'';position:absolute;top:32px;right:-8px;width:16px;height:1.5px;background:var(--brd2);transform:translateY(-50%);z-index:0}
.ps-item.done:not(:last-child)::after{background:linear-gradient(90deg,var(--grn),var(--brd2))}
.ps-item.active:not(:last-child)::after{background:linear-gradient(90deg,var(--acc),var(--brd2));animation:psFlow 2s linear infinite;background-size:200% 100%}
@keyframes psFlow{0%{background-position:100% 0}100%{background-position:0 0}}
.ps-dot{width:34px;height:34px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--brd2);color:var(--t3);display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:13px;transition:all .4s cubic-bezier(.16,1,.3,1);position:relative;z-index:1}
.ps-item.active .ps-dot{background:radial-gradient(circle at 30% 30%,var(--acc2),var(--acc) 60%,var(--acc-deep));border-color:transparent;color:#0b0b0b;box-shadow:0 0 0 4px var(--glow),0 0 22px rgba(212,247,69,.5);animation:psActivePulse 1.5s ease-in-out infinite}
@keyframes psActivePulse{0%,100%{box-shadow:0 0 0 4px var(--glow),0 0 22px rgba(212,247,69,.5)}50%{box-shadow:0 0 0 6px rgba(212,247,69,.18),0 0 32px rgba(212,247,69,.7)}}
.ps-item.done .ps-dot{background:radial-gradient(circle at 30% 30%,#86efac,var(--grn) 60%,#16a34a);border-color:transparent;color:#0b0b0b;box-shadow:0 0 12px rgba(74,222,128,.35)}
.ps-item.failed .ps-dot{background:radial-gradient(circle at 30% 30%,#ff8888,var(--red) 60%,#a02020);border-color:transparent;color:#0b0b0b;box-shadow:0 0 16px rgba(239,68,68,.5)}
.ps-name{font-size:10.5px;color:var(--t3);text-align:center;line-height:1.2;font-weight:600;max-width:100px}
.ps-item.active .ps-name{color:var(--acc2)}
.ps-item.done .ps-name{color:var(--grn)}

/* Failed state hero — used on the live page when scan fails */
.fail-hero{position:relative;padding:24px 28px;border-radius:18px;background:linear-gradient(135deg,rgba(239,68,68,.10),rgba(239,68,68,.02));border:1px solid rgba(239,68,68,.30);margin-bottom:20px;overflow:hidden}
.fail-hero::before{content:'';position:absolute;top:0;left:-100%;width:200%;height:1px;background:linear-gradient(90deg,transparent,rgba(239,68,68,.5),transparent);animation:failSweep 3s linear infinite}
@keyframes failSweep{from{transform:translateX(0)}to{transform:translateX(50%)}}

/* Skeleton shimmer for empty states */
.skel{position:relative;background:var(--s2);border-radius:8px;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:skelSweep 1.6s linear infinite}
@keyframes skelSweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Pricing cycle toggle — pill switcher */
.btn-cycle{background:transparent;border:none;color:var(--t3);padding:9px 18px;font:600 12.5px 'Inter',sans-serif;cursor:pointer;border-radius:999px;display:inline-flex;align-items:center;gap:6px;transition:all var(--med)}
.btn-cycle:hover{color:var(--t1)}
.btn-cycle.on{background:linear-gradient(135deg,var(--acc),var(--acc-deep));color:#0b0b0b;box-shadow:0 4px 16px rgba(212,247,69,.35),inset 0 1px 0 rgba(255,255,255,.18)}

/* Recent Scans table — animated row entry + sticky header */
@keyframes rowIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.tbl thead th{position:sticky;top:0;background:var(--s2);backdrop-filter:blur(6px);z-index:1;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);font-weight:700;padding:14px 18px;border-bottom:1px solid var(--brd)}
.tbl tbody tr{cursor:pointer;transition:background var(--fast),transform var(--fast)}
.tbl tbody tr:hover{background:linear-gradient(90deg,var(--glow2) 0%,transparent 80%)}
.tbl tbody tr:hover button{background:var(--s3);color:var(--t0);border-color:var(--brd3)}
.tbl tbody td{padding:14px 18px;border-bottom:1px solid var(--brd);font-size:13px}
.tbl tbody tr:last-child td{border-bottom:0}

/* Solar System — bigger sun, brighter planets, stronger orbital glow */
.sun{width:128px!important;height:128px!important;font-size:42px!important;
  box-shadow:0 0 70px rgba(212,247,69,.7),0 0 160px rgba(212,247,69,.4),inset 0 2px 0 rgba(255,255,255,.35)!important}
.planet-body{width:60px!important;height:60px!important;font-size:15px!important;border-width:2px!important}
.planet-label{font-size:11px!important;font-weight:700!important}
.planet.active .planet-body{box-shadow:0 0 36px rgba(212,247,69,.7),inset 0 1px 0 rgba(255,255,255,.3)!important}
.orbit-path{stroke:rgba(212,247,69,.18)!important}
.orbit-path.active{stroke:rgba(212,247,69,.45)!important;stroke-width:1.5!important}

/* Empty/scarce state for the solar system — visible "scan didn't reach this phase" hint */
.solar::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(21,16,11,.15) 80%);opacity:.5}

/* New Scan wizard step indicator */
.wiz-steps{display:flex;align-items:center;gap:0;margin-bottom:24px}
.wiz-step{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:12px;font-weight:600;flex-shrink:0;transition:color var(--med)}
.wiz-step.on{color:var(--acc2)}
.wiz-step.done{color:var(--grn)}
.wiz-step .num{width:30px;height:30px;border-radius:10px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:800;background:var(--bg2);transition:all var(--med)}
.wiz-step.on .num{background:radial-gradient(circle at 30% 30%,var(--acc2),var(--acc) 60%,var(--acc-deep));border-color:transparent;color:#0b0b0b;box-shadow:0 0 0 4px var(--glow),0 0 22px rgba(212,247,69,.5)}
.wiz-step.done .num{background:radial-gradient(circle at 30% 30%,#86efac,var(--grn) 60%,#16a34a);border-color:transparent;color:#0b0b0b}
.wiz-line{flex:1;height:1.5px;background:var(--brd2);margin:0 12px;min-width:24px;transition:background var(--med)}
.wiz-line.on{background:linear-gradient(90deg,var(--grn),var(--brd2))}

/* ===== Constellation — 3D agent graph (Canvas 2D) ===== */
.constel{position:relative;border-radius:18px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 50%,#1a100808 0%,#000 100%);border:1px solid var(--brd)}
.constel-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;cursor:grab;touch-action:none}
.constel-canvas:active{cursor:grabbing}
.constel-hint{position:absolute;left:14px;bottom:12px;z-index:2;font:600 9.5px/1 'JetBrains Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.55);background:rgba(8,5,3,.6);padding:6px 10px;border-radius:6px;border:1px solid rgba(212,247,69,.18);pointer-events:none;backdrop-filter:blur(4px)}
.constel-hint::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);margin-right:7px;vertical-align:middle;animation:pdot 1.6s ease-in-out infinite}
.constel-legend{position:absolute;right:14px;bottom:12px;z-index:2;display:flex;gap:14px;font:600 9.5px/1 'JetBrains Mono',monospace;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.5);background:rgba(8,5,3,.55);padding:6px 10px;border-radius:6px;border:1px solid rgba(212,247,69,.16);pointer-events:none;backdrop-filter:blur(4px)}
.constel-legend span{display:inline-flex;align-items:center;gap:6px}
.constel-legend span::before{content:'';width:7px;height:7px;border-radius:50%}
.constel-legend .lg-act::before{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.constel-legend .lg-done::before{background:var(--grn)}

/* Side team labels (vertical accents anchored to the canvas) */
.constel-side{position:absolute;top:14px;z-index:2;display:flex;align-items:center;gap:8px;font:700 11px/1 'Inter',system-ui,sans-serif;letter-spacing:.4px;padding:6px 10px;border-radius:8px;background:rgba(8,5,3,.55);backdrop-filter:blur(4px);pointer-events:none}
.constel-side.left{left:14px;border:1px solid rgba(239,68,68,.32);color:var(--rt)}
.constel-side.right{right:14px;border:1px solid rgba(96,165,250,.32);color:var(--bt)}
.constel-side::before{content:'';width:8px;height:8px;border-radius:50%}
.constel-side.left::before{background:var(--rt);box-shadow:0 0 10px var(--rt-glow)}
.constel-side.right::before{background:var(--bt);box-shadow:0 0 10px var(--bt-glow)}
.constel-side .sub{font:500 9.5px 'JetBrains Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:.6px}

/* Floating popover (live agent activity) */
.constel-pop{position:absolute;z-index:10;min-width:240px;max-width:340px;background:rgba(15,10,6,.94);backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(212,247,69,.32);border-radius:12px;padding:12px 14px;box-shadow:0 18px 48px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.2);pointer-events:auto;transform:translate(-50%,calc(-100% - 14px));animation:cpopIn .18s var(--med)}
.constel-pop.team-red{border-color:rgba(239,68,68,.45)}
.constel-pop.team-blue{border-color:rgba(96,165,250,.45)}
@keyframes cpopIn{from{opacity:0;transform:translate(-50%,calc(-100% - 8px)) scale(.95)}to{opacity:1;transform:translate(-50%,calc(-100% - 14px)) scale(1)}}
.constel-pop::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:rgba(15,10,6,.94);border-right:1px solid rgba(212,247,69,.32);border-bottom:1px solid rgba(212,247,69,.32)}
.constel-pop.team-red::after{border-color:rgba(239,68,68,.45)}
.constel-pop.team-blue::after{border-color:rgba(96,165,250,.45)}
.constel-pop-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
