// ===== Risk extraction from artifacts =====
const SEV_MAP={critical:'crit',high:'high',medium:'med',low:'low',informational:'info',info:'info'};
// Read the severity verdict from a SINGLE finding's text — and ONLY if it states one value.
// The agent's output rubric ("**Severity**: Critical / High / Medium / Low") appears verbatim
// in the prose; a multi-value match means we're looking at the rubric, not a verdict, so we
// fall back instead of falsely picking 'critical'.
function severityFromText(text,fallback){
  const line=/severity[\s:*]*([^\n\r]+)/i.exec(text||'');
  if(!line)return fallback;
  const words=line[1].match(/\b(critical|high|medium|low|informational|info)\b/ig)||[];
  if(words.length!==1)return fallback;
  return SEV_MAP[words[0].toLowerCase()]||fallback;
}
function computeRiskBreakdown(f){
  const out={crit:0,high:0,med:0,low:0,info:0,total:0,confirmed:0,potential:0,list:[],byCat:{}};
  const cats=[
    {key:'sqli',name:'SQL Injection'},
    {key:'xss',name:'Cross-Site Scripting'},
    {key:'auth-bypass',name:'Authentication Bypass'},
    {key:'authz-bypass',name:'Authorization Bypass'},
    {key:'ssrf',name:'Server-Side Request Forgery'},
    {key:'business-logic',name:'Business Logic Flaw'},
    {key:'misconfig',name:'Security Misconfiguration'},
    {key:'info-disclosure',name:'Information Disclosure'},
  ];
  const add=(cat,name,sev,conf)=>{
    out[sev]++;out.total++;out[conf==='confirmed'?'confirmed':'potential']++;
    out.byCat[cat]=(out.byCat[cat]||0)+1;
    out.list.push({cat,name,sev,conf,
      kind:conf==='confirmed'?'confirmed exploit':conf==='likely'?'likely':'theoretical',
      evidence:conf==='confirmed'?'reproduced':conf==='likely'?'high confidence':'unverified'});
  };
  cats.forEach(c=>{
    const expl=f.exploits?.[c.key];
    const explConfirmed=!!expl&&/reproduc|confirmed|verified|success/i.test(expl);
    const queue=f.queues?.[c.key];
    const findings=Array.isArray(queue?.findings)?queue.findings:null;
    if(findings){
      // STRUCTURED path: count the agent's actual findings, honoring each one's stated
      // confidence (CONFIRMED/LIKELY/THEORETICAL) and per-finding severity.
      findings.forEach(fd=>{
        const conf=explConfirmed?'confirmed':(fd.type||'theoretical').toLowerCase();
        const sev=severityFromText(fd.description,SEV_MAP[(fd.severity||'').toLowerCase()]||'med');
        add(c.key,c.name,sev,conf==='confirmed'?'confirmed':conf==='likely'?'likely':'potential');
      });
      return;
    }
    // FALLBACK (no structured queue): infer from prose, but skip clear no-finding results and
    // parse severity from a stated verdict rather than any 'critical' substring.
    const vuln=f.vulns?.[c.key];
    if(!vuln&&!expl)return;
    if(vuln&&!/##\s+(attack|finding)/i.test(vuln)&&/\b(no |not |none|no evidence|not vulnerable|not exploitable|appears secure|no findings?)\b/i.test(vuln.slice(0,500)))return;
    const sev=explConfirmed?'high':severityFromText(vuln,'med');
    add(c.key,c.name,sev,explConfirmed?'confirmed':'potential');
  });
  if(f.securityHeaders){
    try{const h=JSON.parse(f.securityHeaders);if(h.missing&&h.missing.length){h.missing.forEach(m=>{out.low++;out.total++;out.confirmed++;out.byCat.misconfig=(out.byCat.misconfig||0)+1;out.list.push({cat:'misconfig',name:'Missing '+m,sev:'low',conf:'confirmed',kind:'header policy',evidence:'absent'})})}}catch{}
  }
  // Sort by severity
  const order={crit:0,high:1,med:2,low:3,info:4};
  out.list.sort((a,b)=>order[a.sev]-order[b.sev]);
  return out;
}
function computePostureScore(rb){
  // Confidence-weighted: a CONFIRMED finding hits full severity weight; LIKELY/THEORETICAL
  // findings count partially — a white-box analysis flags risk but isn't proof of exploitation.
  const W={crit:22,high:12,med:5,low:1,info:0};
  let score=100;
  for(const item of rb.list){
    const factor=item.conf==='confirmed'?1:item.conf==='likely'?0.6:0.35;
    score-=(W[item.sev]||0)*factor;
  }
  return Math.max(0,Math.min(100,Math.round(score)));
}
function scoreToGrade(s){if(s>=92)return'A';if(s>=84)return'A-';if(s>=76)return'B+';if(s>=68)return'B';if(s>=60)return'C';if(s>=50)return'D';return'F'}
function posturePhrase(s){
  if(s>=85)return'Strong defensive posture. Few findings; remediation focus is preventative.';
  if(s>=70)return'Acceptable posture with several issues. Prioritize medium and high findings.';
  if(s>=55)return'Concerning posture. Critical or high-severity findings present and exploitable.';
  return'Critical posture. Multiple severe findings — incident response and remediation are urgent.';
}

async function csQuickScanFile(file){
  const status=$('cs-file-status'),resultBox=$('cs-file-result');
  if(!file)return;
  if(file.size>256_000){status.innerHTML=`<span style="color:var(--red)">${H(file.name)} is too large (${(file.size/1024).toFixed(0)}KB). Maximum 256KB — try Project mode.</span>`;return}
  const text=await file.text();
  const keys=csLoadKeys();
  if(!keys.claude){const k=await promptForAnthropicKey('Anthropic key required to start the scan.');if(!k)return}

  status.innerHTML=`<span class="sp" style="vertical-align:middle;margin-right:8px"></span> Scanning <strong style="color:var(--t1)">${H(file.name)}</strong> (${(file.size/1024).toFixed(1)}KB)…`;
  resultBox.innerHTML='';

  try{
    const r=await fetch('/api/code-scan/quick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:text,filename:file.name,keys:csLoadKeys()})});
    const d=await r.json();
    if(!d.ok){throw new Error(d.error||'Scan failed')}
    if(!d.result){throw new Error(d.error||'No result')}
    status.innerHTML=`<span style="color:var(--grn)">${ico('check',{cls:'ico-sm'})} Scan complete</span>`;
    CS_RESULT=d.result;
    csRenderQuickResult(d.result,file.name,resultBox);
  }catch(e){
    status.innerHTML=`<span style="color:var(--red)">Error: ${H(e.message)}</span>`;
  }
}

const CS_BIN_RE=/\.(png|jpg|jpeg|gif|webp|ico|svg|mp4|mov|avi|mp3|wav|ogg|pdf|zip|tar|gz|7z|rar|exe|dll|so|dylib|class|jar|war|wasm|bin|woff|woff2|ttf|otf|eot|psd|sketch|fig|min\.js|min\.css|map)$/i;
const CS_SKIP_DIR_RE=/(^|\/)(node_modules|\.git|\.svn|\.hg|\.next|\.nuxt|dist|build|coverage|target|vendor|__pycache__|\.venv|venv|\.idea|\.vscode|\.cache|out|tmp|logs?)(\/|$)/i;
const CS_SKIP_FILE_RE=/(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|composer\.lock|Cargo\.lock|poetry\.lock|Gemfile\.lock|\.DS_Store|Thumbs\.db)$/i;
const CS_SCAN_EXT=new Set(['js','jsx','mjs','cjs','ts','tsx','py','go','rs','java','kt','rb','php','cs','cpp','cc','c','h','hpp','swift','sol','sql','html','css','scss','vue','svelte','yaml','yml','json','sh','ps1','bash','dockerfile','rb']);

function csIsScanCandidate(path,size){
  if(size>256_000)return false;
  if(CS_BIN_RE.test(path))return false;
  if(CS_SKIP_DIR_RE.test('/'+path))return false;
  if(CS_SKIP_FILE_RE.test(path))return false;
  const ext=(path.split('.').pop()||'').toLowerCase();
  return CS_SCAN_EXT.has(ext);
}

        <button class="btn btn-g" type="button" id="cs-pick-folder" style="display:inline-flex;align-items:center;gap:6px">${ico('list',{cls:'ico-sm'})} Pick a folder</button>
      </div>
      <input type="file" id="cs-zip-input"    accept=".zip,application/zip" style="display:none">
      <input type="file" id="cs-folder-input" webkitdirectory directory multiple style="display:none">
    </div>
    <div id="cs-proj-tree-wrap"></div>
  </div>`;

  $('cs-pick-zip').onclick=()=>$('cs-zip-input').click();
  $('cs-pick-folder').onclick=()=>$('cs-folder-input').click();
  $('cs-zip-input').onchange=e=>{const f=e.target.files[0];if(f)csIngestZip(f)};
  $('cs-folder-input').onchange=e=>csIngestFolder(e.target.files);

  const dz=$('cs-dz-proj');
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));
  dz.addEventListener('drop',async e=>{
    e.preventDefault();dz.classList.remove('drag');
    const f=e.dataTransfer.files[0];
    if(!f)return;
    if(f.name.toLowerCase().endsWith('.zip'))csIngestZip(f);
    else csIngestFolder(e.dataTransfer.files);
  });
}

async function csIngestZip(file){
  csProjStatus(`Reading ${file.name} (${(file.size/1024/1024).toFixed(1)}MB)…`);
  try{
    const zip=await JSZip.loadAsync(file);
    const entries=[];
    const promises=[];
    zip.forEach((path,entry)=>{
      if(entry.dir)return;
      promises.push(entry.async('uint8array').then(data=>{
        const size=data.byteLength;
        const candidate=csIsScanCandidate(path,size);
        let content=null;
        if(candidate){
          try{content=new TextDecoder('utf-8',{fatal:false}).decode(data)}catch{content=null}
        }
        entries.push({path,size,content,scan:candidate&&content!==null});
      }));
    });
    await Promise.all(promises);
    csOnProjectLoaded(entries);
  }catch(e){
    csProjStatus(`<span style="color:var(--red)">Failed to read zip: ${H(e.message)}</span>`);
  }
}

async function csIngestFolder(fileList){
  if(!fileList||!fileList.length)return;
  csProjStatus(`Reading ${fileList.length} files…`);
  const entries=[];
  const tasks=[];
  for(const f of fileList){
    const path=f.webkitRelativePath||f.name;
    const candidate=csIsScanCandidate(path,f.size);
    if(candidate){
      tasks.push(f.text().then(t=>entries.push({path,size:f.size,content:t,scan:true})).catch(()=>entries.push({path,size:f.size,content:null,scan:false})));
    } else {
      entries.push({path,size:f.size,content:null,scan:false});
    }
  }
  await Promise.all(tasks);
  csOnProjectLoaded(entries);
}

function csProjStatus(html){

}

function csTreeRows(){
  return CS_PROJECT.files.map(e=>{
    const sel=CS_PROJECT.selected.has(e.path);
    const fp=CS_PROJECT.patches.get(e.path);
    const cls=['cs-tree-row'];
    if(!e.scan)cls.push('skipped');
    if(fp){
      const findings=fp.findings||[];
      if(findings.some(f=>f.severity==='critical'))cls.push('has-critical');
      else if(findings.length>0)cls.push('has-findings');
      else cls.push('scanned');
    }
    return `<div class="${cls.join(' ')}" data-path="${H(e.path)}" data-skipped="${e.scan?'0':'1'}">

      <span class="meta">${(e.size/1024).toFixed(1)}KB${fp?` · ${fp.findings.length} findings`:''}</span>

  }).join('');
}

function csSelectAll(on){

async function csScanProject(){
  const keys=csLoadKeys();
  if(!keys.claude){const k=await promptForAnthropicKey('Anthropic key required to scan the project.');if(!k)return}
  const sel=Array.from(CS_PROJECT.selected);
  if(!sel.length){csToast('Select at least one file','error');return}
  CS_PROJECT.scanning=true;CS_PROJECT.cancelled=false;CS_PROJECT.patches=new Map();CS_PROJECT.findings=[];
  $('cs-scan-proj').disabled=true;
  $('cs-cancel-proj').style.display='inline-flex';
  $('cs-prog-wrap').style.display='block';
  const status=$('cs-proj-status');

  let done=0,failed=0;
  const total=sel.length;
  const concurrency=3;
  let i=0;
  async function worker(){
    while(i<sel.length&&!CS_PROJECT.cancelled){
      const path=sel[i++];
      const file=CS_PROJECT.files.find(f=>f.path===path);
      if(!file||!file.content)continue;
      status.textContent=`Scanning (${done+1}/${total}) ${path}…`;
      try{
        const r=await fetch('/api/code-scan/quick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:file.content,filename:path,keys:csLoadKeys()})});
        const d=await r.json();
        if(d.ok&&d.result){
          const result=d.result;
          CS_PROJECT.patches.set(path,{findings:result.redTeam?.findings||[],fixedCode:result.blueTeam?.fixedCode||file.content,result});
          for(const f of (result.redTeam?.findings||[]))CS_PROJECT.findings.push({...f,file:path});
        } else {
          failed++;
          CS_PROJECT.patches.set(path,{findings:[],fixedCode:file.content,error:d.error||'failed'});
        }
      }catch(e){failed++}
      done++;
      const pct=Math.round((done/total)*100);
      $('cs-prog-fill').style.width=pct+'%';
      csRenderProjectTree();
    }
  }
  const workers=Array.from({length:Math.min(concurrency,total)},()=>worker());
  await Promise.all(workers);
  CS_PROJECT.scanning=false;
  $('cs-scan-proj').disabled=false;
  $('cs-cancel-proj').style.display='none';
  status.textContent=CS_PROJECT.cancelled?`Cancelled at ${done}/${total}`:`Scan complete · ${done} files · ${failed} failed`;
  status.style.color=CS_PROJECT.cancelled?'var(--ylw)':'var(--grn)';
  csRenderProjectResult();
}

async function csDownloadFixedZip(){
  const zip=new JSZip();
  for(const [path,p] of CS_PROJECT.patches){
    zip.file(path,p.fixedCode||'');
  }
  // Include unscanned files unchanged so the zip is a complete drop-in replacement
  for(const f of CS_PROJECT.files){
    if(CS_PROJECT.patches.has(f.path))continue;
    if(f.content!==null)zip.file(f.path,f.content);
  }
  // Manifest
  const manifest={
    generatedAt:new Date().toISOString(),
    totalFiles:CS_PROJECT.files.length,
    scannedFiles:CS_PROJECT.patches.size,
    findings:CS_PROJECT.findings.length,
    findingsBySeverity:CS_PROJECT.findings.reduce((a,f)=>{a[f.severity]=(a[f.severity]||0)+1;return a},{}),
  };
  zip.file('SHANNON-FIXES-MANIFEST.json',JSON.stringify(manifest,null,2));
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='shannon-fixes.zip';a.click();URL.revokeObjectURL(url);
  csToast('Downloaded shannon-fixes.zip','success');
}

function csSetAgent(id,state,sub){
  const el=$('cs-ag-'+id);
  if(el){
    el.classList.remove('thinking','done','failed');
    if(state)el.classList.add(state);
    const stat=el.querySelector('.cs-stat');
    if(stat)stat.textContent=({thinking:'thinking',done:'done',failed:'failed',idle:'idle'})[state]||state;
    if(sub){const r=el.querySelector('.cs-arole');if(r)r.textContent=sub}
  }
  try{
    window._constelCs?.setState(id, state);
    if (sub) window._constelCs?.setStep(id, sub);
  }catch{}
}

function csResetArena(){
  ['r1','r2','b1','b2'].forEach(id=>{
    const meta=CS_AGENT_LABEL[id];
    csSetAgent(id,'idle',meta.sub+' · waiting');
  });
  $('cs-link').textContent='awaiting kickoff';
  $('cs-link').classList.remove('active');
  CS_TURNS=[];CS_RESULT=null;
  try{ window._constelCs?.reset(); }catch{}
  $('cs-out').innerHTML=`<div class="crd" style="padding:18px 20px"><div class="cs-turn-h" style="margin-bottom:10px"><span class="cs-turn-step">live transcript</span></div><div id="cs-trans" class="cs-trans"><div style="color:var(--t3);font-size:12px;text-align:center;padding:12px">Waiting for first turn…</div></div></div>`;
}

async function csRunMulti(){
  const code=$('cs-code').value;
  const fname=$('cs-fname').value;
  const status=$('cs-status'),btn=$('cs-run'),cancel=$('cs-cancel');
  if(!code.trim()){status.textContent='Paste or attach code first';status.style.color='var(--red)';return}
  let keys=csLoadKeys();
  if(!keys.claude){
    const k=await promptForAnthropicKey('Anthropic API key required to start the war room.');
    if(!k){status.textContent='cancelled';status.style.color='var(--ylw)';return}
    keys=csLoadKeys();
  }
  btn.disabled=true;btn.innerHTML='<span class="sp"></span> War room running…';
  cancel.style.display='inline-flex';
  status.style.color='var(--t3)';status.textContent='auto-picking agents from leaderboard…';
  csResetArena();
  try{
    const r=await fetch('/api/code-scan/multi/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,filename:fname||undefined,keys})});
    const d=await r.json();
    if(!d.ok){
      if(r.status===401){pgCode();return}
      throw new Error(d.error||'Start failed');
    }
    CS_RUN=d.runId;CS_AGENTS=d.agents;CS_PHASES=d.phases;
    csApplyLineup(d.agents);
    csOpenStream(d.runId);
  }catch(e){
    status.textContent='error: '+e.message;status.style.color='var(--red)';
    btn.disabled=false;btn.innerHTML='⚔ Run War-Room Scan';cancel.style.display='none';
  }
}

// Re-skin the 4 agent cards with the auto-picked provider lineup.
function csApplyLineup(agents){
  const PROV={claude:{label:'Claude',short:'C',grad:'background:radial-gradient(circle at 30% 30%,#ff8888,var(--rt) 60%,#a02020)'},
              openai:{label:'GPT-4o',short:'G',grad:'background:radial-gradient(circle at 30% 30%,#3ec795,#10a37f 60%,#0a6e55)'},
              gemini:{label:'Gemini',short:'g',grad:'background:radial-gradient(circle at 30% 30%,#7ab8ff,var(--bt) 60%,#1e3a8a)'},
              glm:{label:'GLM-4-Plus',short:'Z',grad:'background:radial-gradient(circle at 30% 30%,#aacfc4,#88b3a8 60%,#557b73)'}};
  for(const a of agents){
    const card=$('cs-ag-'+a.id);if(!card)return;
    const p=PROV[a.provider]||PROV.claude;
    const av=card.querySelector('.cs-av');
    if(av){av.textContent=p.short;av.setAttribute('style',`width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:14px;color:#0b0b0b;flex-shrink:0;border:1px solid rgba(255,255,255,.08);${p.grad}`)}
    const name=card.querySelector('.cs-aname');
    if(name)name.textContent=a.name;
    const role=card.querySelector('.cs-arole');
    if(role)role.textContent=`${p.label} · score ${a.score.toFixed(1)} · waiting`;
    // remember provider on the card so transcript can render correct initial
    card.dataset.provider=a.provider;
    card.dataset.short=p.short;
  }
  CS_AGENT_LABEL=Object.fromEntries(agents.map(a=>[a.id,{team:a.team,name:a.name,sub:PROV[a.provider]?.label||a.provider,short:PROV[a.provider]?.short||'·'}]));
  try{
    const c=window._constelCs;
    if(c){
      for(const a of agents){
        const meta=CS_AGENT_LABEL[a.id];
        const node=c.nodes.find(n=>n.id===a.id);
        if(node){
          node.name=`${a.name} · ${meta.sub}`;
          node.team=a.team;
          node.role=`${meta.sub} · score ${a.score.toFixed(1)} · waiting`;
        }
        c.setStep(a.id,`${meta.sub} · waiting`);
      }
    }
  }catch{}
}

function csCancelRun(){
  if(!CS_RUN)return;
  fetch('/api/code-scan/multi/'+CS_RUN+'/cancel',{method:'POST'}).catch(()=>{});
}

function csOpenStream(runId){
  if(CS_EVT){CS_EVT.close();CS_EVT=null}
  CS_EVT=new EventSource('/api/code-scan/multi/'+runId+'/events');
  CS_EVT.onmessage=ev=>{try{csHandle(JSON.parse(ev.data))}catch(e){console.error(e)}};
  CS_EVT.onerror=()=>{};
}

function csHandle(e){
  if(e.type==='phase-start'){
    const meta=CS_AGENT_LABEL[e.agentId];
    csSetAgent(e.agentId,'thinking',meta.sub+' · '+e.step.toLowerCase());
    $('cs-link').textContent=`${meta.name} (${meta.sub}) → ${e.step}`;
    $('cs-link').classList.add('active');
    $('cs-status').textContent=`phase ${e.phaseIndex+1}/${CS_PHASES.length} · ${meta.name}`;
    $('cs-status').style.color='var(--acc2)';
  }
  else if(e.type==='turn'){
    const meta=CS_AGENT_LABEL[e.agentId];
    csSetAgent(e.agentId,'done',meta.sub+' · '+(e.fallback?'fallback':'done')+' · '+(e.ms/1000).toFixed(1)+'s');
    CS_TURNS.push(e);
    csAppendTurn(e);
  }
  else if(e.type==='complete'){
    CS_RESULT=e.result;
    $('cs-link').textContent='war room complete';
    $('cs-link').classList.remove('active');
    $('cs-status').textContent='✓ scan complete';
    $('cs-status').style.color='var(--grn)';
    $('cs-run').disabled=false;$('cs-run').innerHTML='⚔ Run War-Room Scan';
    $('cs-cancel').style.display='none';
    if(CS_EVT){CS_EVT.close();CS_EVT=null}
    csRenderFinal(e.result);
  }
  else if(e.type==='failed'){
    if(e.agentId)csSetAgent(e.agentId,'failed');
    $('cs-status').textContent='error: '+e.error;$('cs-status').style.color='var(--red)';
    $('cs-run').disabled=false;$('cs-run').innerHTML='⚔ Run War-Room Scan';
    $('cs-cancel').style.display='none';
    if(CS_EVT){CS_EVT.close();CS_EVT=null}
  }
  else if(e.type==='cancelled'){
    $('cs-status').textContent='cancelled';$('cs-status').style.color='var(--ylw)';
    $('cs-run').disabled=false;$('cs-run').innerHTML='⚔ Run War-Room Scan';
    $('cs-cancel').style.display='none';
    if(CS_EVT){CS_EVT.close();CS_EVT=null}
  }
}

function csAppendTurn(t){
  // Push the turn text into this agent's constellation popover so clicking the dot shows what they said.
  try{
    const fence=t.text&&t.text.match(/```json\s*([\s\S]+?)\s*```/);
    const body=fence?'[Final synthesis — see report below]':t.text;
    window._constelCs?.setOutput(t.agentId, body);
    window._constelCs?.setStep(t.agentId, t.step + ' · ' + (t.ms/1000).toFixed(1) + 's' + (t.fallback?' · via Claude fallback':''));
  }catch{}
  const trans=$('cs-trans');if(!trans)return;
  if(CS_TURNS.length===1)trans.innerHTML='';
  const meta=CS_AGENT_LABEL[t.agentId];
  const div=document.createElement('div');
  div.className='cs-turn '+meta.team;
  div.innerHTML=`<div class="cs-turn-h">
    <div class="cs-av ${t.agentId}">${csInitial(t.agentId)}</div>
    <div><div class="cs-turn-name">${H(meta.name)} <span style="color:var(--t3);font-weight:500;font-size:11px">— ${H(meta.sub)}</span></div><div class="cs-turn-step">${H(t.step)}${t.fallback?` · <span style="color:var(--ylw)">via Claude fallback</span>`:''} · ${(t.ms/1000).toFixed(1)}s</div></div>
  </div>
  <div class="cs-turn-text">${csTurnRender(t.text)}</div>`;
  trans.appendChild(div);
  trans.scrollTop=trans.scrollHeight;
}
function csInitial(id){return CS_AGENT_LABEL[id]?.short||({r1:'C',r2:'G',b1:'g',b2:'Z'})[id]||'·'}
function csTurnRender(text){
  // strip JSON fence in synth turn — render summary instead
  const fence=text.match(/```json\s*([\s\S]+?)\s*```/);
  if(fence){
    return `<div style="color:var(--t2);font-style:italic">[Final synthesis — see tabs below]</div>`;
  }
  // Convert markdown-ish: ```code``` blocks + inline `code`
  let html=H(text);
  html=html.replace(/```([\s\S]+?)```/g,(_,c)=>`<pre>${c}</pre>`);
  html=html.replace(/`([^`\n]+?)`/g,(_,c)=>`<code>${c}</code>`);
  return html;
}

function csRenderFinal(r){
  if(!r){$('cs-out').innerHTML+=`<div class="crd" style="padding:18px;color:var(--red)">No result returned.</div>`;return}
  if(r.error){
    // Hard parse failure with no recoverable fields. Last-ditch: scan raw text for a
    // ```...``` block and offer that as a download so the user isn't empty-handed.
    const raw=r.raw||'';
    const fences=[...raw.matchAll(/```(?:[a-z]+)?\s*\n([\s\S]*?)```/gi)];
    const salvaged=fences.length?fences[fences.length-1][1].trim():'';
    const fname=$('cs-fname').value||'fixed.txt';
    window._csMultiFixed=salvaged;
    window._csMultiFixedName=fname;
    $('cs-out').innerHTML+=`<div class="crd" style="padding:18px;border-color:rgba(239,68,68,.4)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <span class="bx bx-r">parse error</span> &nbsp;<span style="color:var(--t1);font-size:13px">${H(r.error)}</span>
          ${salvaged?`<div style="color:var(--t3);font-size:11.5px;margin-top:6px">Recovered ${salvaged.length.toLocaleString()} chars from the last code block — use the buttons →</div>`:''}
        </div>
        ${salvaged?`<div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-g" style="padding:6px 12px;font-size:11px" onclick="csCopyText(window._csMultiFixed||'')">${ico('check',{cls:'ico-sm'})} Copy</button>
          <button class="btn btn-p" style="padding:6px 12px;font-size:11px" onclick="csDl(window._csMultiFixed||'',window._csMultiFixedName||'fixed.txt','text/plain')">${ico('file-text',{cls:'ico-sm'})} Download</button>
        </div>`:''}
      </div>
      <pre style="margin-top:10px;background:var(--bg);padding:10px;border-radius:8px;font-family:'JetBrains Mono';font-size:11px;white-space:pre-wrap;max-height:300px;overflow:auto">${H(raw)}</pre>
    </div>`;
    const out=$('cs-out');if(out)out.scrollIntoView({behavior:'smooth',block:'end'});
    return;
  }

  const findings=r.redTeam?.findings||[];
  const patches=r.blueTeam?.patches||[];
  const risk=r.overallRisk||'info';
  const riskC={critical:'var(--red)',high:'var(--org)',medium:'var(--ylw)',low:'var(--blu)',clean:'var(--grn)',info:'var(--t2)'}[risk]||'var(--t2)';
  const fixedCode=r.blueTeam?.fixedCode||'';
  // Partial-recovery banner — server got fixedCode out even though the wrapper JSON was truncated.
  if(r._partial){
    $('cs-out').innerHTML+=`<div class="crd" style="padding:14px 18px;border-color:rgba(255,194,77,.55);background:rgba(255,194,77,.08);margin-top:14px">
      <div style="color:var(--ylw);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Partial recovery</div>
      <div style="color:var(--t1);font-size:13px;margin-top:4px">Final synthesis JSON was truncated, but Shannon salvaged the corrected code${findings.length?` and ${findings.length} finding${findings.length===1?'':'s'}`:''}. Download below.</div>
    </div>`;
  }
  const fixedName=$('cs-fname').value||'fixed.txt';
  window._csMultiFixed=fixedCode;
  window._csMultiFixedName=fixedName;

  $('cs-out').innerHTML+=`
    <div class="crd" style="padding:18px 20px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
      <div>
        <div style="color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.8px">${H(r.language||'unknown')}</div>
        <div class="h-display" style="font-size:22px;margin-top:2px">Overall risk: <span style="color:${riskC}">${H(risk)}</span></div>
        <div style="color:var(--t3);font-size:12px;margin-top:6px">
          <span style="color:var(--rt);font-weight:600">${findings.length}</span> red findings ·
          <span style="color:var(--bt);font-weight:600">${patches.length}</span> blue patches
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-g" style="padding:8px 14px;font-size:12px;display:inline-flex;align-items:center;gap:6px" ${fixedCode?'':'disabled'} onclick="csCopyText(window._csMultiFixed||'')">${ico('check',{cls:'ico-sm'})} Copy fixed</button>
        <button class="btn btn-p" style="padding:8px 14px;font-size:12px;display:inline-flex;align-items:center;gap:6px" ${fixedCode?'':'disabled'} onclick="csDl(window._csMultiFixed||'',window._csMultiFixedName||'fixed.txt','text/plain')">${ico('file-text',{cls:'ico-sm'})} Download fixed file</button>
      </div>
    </div>
    <div class="crd" style="padding:0;margin-top:14px;overflow:hidden">
      <div class="cs-tabs" style="padding:0 14px">
        <button class="cs-tab on" data-tab="findings">🔥 Findings (${findings.length})</button>
        <button class="cs-tab" data-tab="patches">🛡 Patches (${patches.length})</button>
        <button class="cs-tab" data-tab="fixed">📄 Fixed Code</button>
        <button class="cs-tab" data-tab="report">📋 Full Report</button>
      </div>
      <div id="cs-tab-content" style="padding:18px 20px"></div>
    </div>
  `;
  document.querySelectorAll('.cs-tab').forEach(b=>b.onclick=()=>csShowTab(b.dataset.tab));
  csShowTab('findings');
  // Scroll the result (with the Download button) into view so users actually see it
  // when the scan finishes — otherwise it lands below a long live transcript.
  const out=$('cs-out');
  if(out){
    const lastCard=out.querySelector('.crd:nth-last-child(2)');
    (lastCard||out).scrollIntoView({behavior:'smooth',block:'start'});
  }
}

        return `<details class="crd" style="padding:14px 16px;background:var(--bg2);margin-bottom:8px" open>

            </div>

          </summary>
          <div style="margin-top:12px;color:var(--t1);font-size:13px;line-height:1.55">${H(f.description||'')}</div>
          ${f.exploit?`<div style="margin-top:10px"><div style="color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-weight:700">Proof of Concept</div><pre style="background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:10px 12px;font-family:'JetBrains Mono';font-size:11.5px;color:var(--t1);white-space:pre-wrap;overflow-x:auto">${H(f.exploit)}</pre></div>`:''}
        </details>`;
      }).join(''));
  }
  else if(tab==='patches'){
    const patches=r.blueTeam?.patches||[];
    c.innerHTML=`<p style="color:var(--t2);font-size:13px;margin-bottom:14px;line-height:1.6">${H(r.blueTeam?.summary||'')}</p>`+
      (patches.length===0?`<div style="color:var(--t3);font-size:13px">No patches needed.</div>`:patches.map(p=>`
        <div class="crd" style="padding:12px 14px;background:var(--bg2);border-color:rgba(96,165,250,.25);margin-bottom:8px">
          <div style="color:var(--bt);font-size:11px;font-weight:600">fixes ${(p.findingIds||[]).join(', ')||'—'}</div>
          <div style="color:var(--t0);font-size:13.5px;font-weight:600;margin-top:4px">${H(p.description||'')}</div>
          <div style="color:var(--t2);font-size:12px;margin-top:4px;line-height:1.55">${H(p.rationale||'')}</div>
        </div>`).join(''));
  }
  else if(tab==='fixed'){
    const fc=r.blueTeam?.fixedCode||'';
    c.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.8px">Patched source — ready to ship</div>

function csDl(text,name,mime){
  const blob=new Blob([text],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}

// ===== Helpers =====
function md(s){try{return marked.parse(s||'')}catch{return'<pre>'+H(s)+'</pre>'}}
function H(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function host(u){try{return new URL(u).hostname}catch{return u}}
function fmtDate(d){return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(d))}

    .auth-foot a{color:var(--acc2);cursor:pointer;text-decoration:none}
    .auth-foot a:hover{text-decoration:underline}
    .auth-consent{display:flex;align-items:flex-start;gap:9px;margin:14px 2px 6px;font-size:12px;line-height:1.5;color:var(--t2);cursor:pointer;user-select:none}
    .auth-consent input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--brd3);border-radius:4px;background:var(--bg);cursor:pointer;flex-shrink:0;margin-top:1px;position:relative;transition:all var(--fast)}
    .auth-consent input[type="checkbox"]:hover{border-color:var(--acc)}
    .auth-consent input[type="checkbox"]:checked{background:var(--acc);border-color:var(--acc)}
    .auth-consent input[type="checkbox"]:checked::after{content:'';position:absolute;left:4px;top:0px;width:5px;height:10px;border:solid #0b0b0b;border-width:0 2px 2px 0;transform:rotate(45deg)}
    .auth-consent a{color:var(--acc2);text-decoration:none}
    .auth-consent a:hover{text-decoration:underline}
  </style>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-mark" role="img" aria-label="Securovix"></div>
      <div>
        <h1>Securovix</h1>
        <span>Pentest Framework</span>
      </div>
    </div>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab on" id="auth-tab-signin" onclick="authSwitch('signin')">Sign in</button>
      <button class="auth-tab" id="auth-tab-signup" onclick="authSwitch('signup')">Create account</button>
    </div>

    <div id="auth-pane">
      <h2 class="auth-h" id="auth-h">Welcome back</h2>
      <p class="auth-sub" id="auth-sub">Sign in to access the multi-LLM war room and your scan history.</p>

      <button class="auth-btn auth-btn-g" id="auth-google" onclick="authGoogle()" ${GOOGLE_CONFIGURED?'':'disabled title="Google OAuth not configured (set GOOGLE_CLIENT_ID env var)"'}>
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.79 2.71v2.26h2.91c1.7-1.57 2.68-3.88 2.68-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.46-.81 5.95-2.18L12.05 13.55c-.8.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.7A5.42 5.42 0 0 1 3.68 9c0-.59.1-1.16.29-1.7V4.97H.96A8.99 8.99 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.99 8.99 0 0 0 9 0 9 9 0 0 0 .96 4.96L3.97 7.3C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      ${GOOGLE_CONFIGURED?'':'<div style="font-size:10.5px;color:var(--t3);text-align:center;margin-top:6px">Google sign-in not configured · set GOOGLE_CLIENT_ID env var</div>'}
      <div class="auth-or">or with email</div>

      <div id="auth-signup-fields" style="display:none">
        <input class="auth-input" id="auth-name" type="text" placeholder="Your name" autocomplete="name">
      </div>
      <input class="auth-input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
      <input class="auth-input" id="auth-pwd" type="password" placeholder="Password (8+ chars)" autocomplete="current-password">

      <label class="auth-consent" id="auth-consent" style="display:none">
        <input type="checkbox" id="auth-consent-cb">
        <span>I am 18+ and I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a> and <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>. I will only scan systems I am authorized to test.</span>
      </label>

      <button class="auth-btn auth-btn-p" id="auth-submit" onclick="authSubmit()">Sign in →</button>
      <div class="auth-err" id="auth-err"></div>
    </div>

    <p class="auth-foot">
      <a href="/terms" target="_blank" rel="noopener">Terms</a> &middot;
      <a href="/privacy" target="_blank" rel="noopener">Privacy</a> &middot;
      Authorized testing only
    </p>
  </div>
  `;
  // Submit on Enter
  ['auth-email','auth-pwd','auth-name'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter')authSubmit()})});
}

let AUTH_MODE='signin';
function authSwitch(mode){
  AUTH_MODE=mode;
  document.getElementById('auth-tab-signin').classList.toggle('on',mode==='signin');
  document.getElementById('auth-tab-signup').classList.toggle('on',mode==='signup');
  document.getElementById('auth-h').textContent=mode==='signup'?'Create your account':'Welcome back';
  document.getElementById('auth-sub').textContent=mode==='signup'?'Create an account to keep your scan history. Every feature is free for everyone — no plans or limits.':'Sign in to access your scan history. All features are free.';
  document.getElementById('auth-signup-fields').style.display=mode==='signup'?'block':'none';
  document.getElementById('auth-consent').style.display=mode==='signup'?'flex':'none';
  document.getElementById('auth-pwd').setAttribute('autocomplete',mode==='signup'?'new-password':'current-password');
  document.getElementById('auth-submit').textContent=mode==='signup'?'Create account →':'Sign in →';
  document.getElementById('auth-err').textContent='';
}

async function authSubmit(){
  const email=document.getElementById('auth-email').value.trim();
  const pwd=document.getElementById('auth-pwd').value;
  const name=document.getElementById('auth-name')?.value.trim()||'';
  const err=document.getElementById('auth-err');err.textContent='';
  if(!email||!pwd){err.textContent='Email and password are required.';return}
  // Signup requires ticking the Terms + Privacy + age consent box.
  if (AUTH_MODE === 'signup'){
    const cb = document.getElementById('auth-consent-cb');
    if (!cb || !cb.checked){
      err.textContent = 'Please accept the Terms and Privacy Policy to continue.';
      return;
    }
  }
  const btn=document.getElementById('auth-submit');btn.disabled=true;btn.innerHTML='<span class="sp"></span> working…';
  try{
    const url=AUTH_MODE==='signup'?'/api/auth/signup':'/api/auth/login';
    const body=AUTH_MODE==='signup'?{email,password:pwd,name,acceptedTerms:true,acceptedAt:Date.now()}:{email,password:pwd};
    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||'Authentication failed.';btn.disabled=false;btn.innerHTML=AUTH_MODE==='signup'?'Create account →':'Sign in →';return}
    CURRENT_USER=d.user;
    document.getElementById('auth-root')?.remove();
    document.querySelector('.app').style.display='';
    mountApp();
  }catch(e){err.textContent=e.message;btn.disabled=false;btn.innerHTML=AUTH_MODE==='signup'?'Create account →':'Sign in →'}
}

function authGoogle(){window.location.href='/auth/google'}

authBoot();
</script>
</body>
</html>
