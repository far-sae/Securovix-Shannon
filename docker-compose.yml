services:
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=db
      - SKIP_DYNAMIC_CONFIG_UPDATE=true
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # Track B tool-broker sidecar. Mounts the host Docker socket so its Sandbox can launch
  # hardened per-tool containers. Egress controls + scope enforcement live in the broker;
  # the worker reaches it at http://tool-broker:8443. Opt-in via the `broker` profile.
  tool-broker:
    build:
      context: .
      dockerfile: packages/tool-broker/Dockerfile
    image: shannon-tool-broker:local
    profiles: [broker]
    expose:
      - "8443"
    environment:
      - BROKER_PORT=8443
      # SHANNON_BROKER_SCOPE / _SCOPE_KEY / _RECORD_KEY / SHANNON_SCAN_NET injected per scan.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  temporal-data:
    driver: local

networks:
  default:
    name: shannon_default
