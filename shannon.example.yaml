target:
  url: https://example.com
  repoPath: /path/to/source/code
  urls:
    focus:
      - /api/
      - /admin/
    avoid:
      - /docs/
      - /static/

authentication:
  type: form
  loginUrl: https://example.com/login
  username: testuser
  password: testpassword
  # totpSecret: JBSWY3DPEHPK3PXP  # Uncomment for TOTP 2FA

pipeline:
  retryPreset: default
  maxConcurrentPipelines: 5

