name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (worker + tool-broker + cli)
        run: pnpm typecheck

      - name: Root unit tests
        run: pnpm test

      - name: Package tests (worker + tool-broker)
        run: pnpm --filter @shannon/worker --filter @shannon/tool-broker test

      - name: Production dependency audit (monorepo)
        run: pnpm audit --prod --audit-level high

      - name: Production dependency audit (dashboard image lockfile)
        run: npm audit --omit=dev --audit-level=high --prefix packages/dashboard

      # Existing formatting/lint debt is still visible while it is paid down.
      - name: Lint (biome, informational)
        run: pnpm lint
        continue-on-error: true
