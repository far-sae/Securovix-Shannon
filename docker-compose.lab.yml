# Local-only deliberately-vulnerable lab for tool-broker end-to-end tests.
# NOT for deployment. Bring up with:  docker compose -f docker-compose.lab.yml up -d --build
services:
  ssti-lab:
    build: ./lab/ssti-app
    image: shannon-lab-ssti:local
    container_name: shannon-lab-ssti
    networks: [shannon-lab]
  # In-house deterministic SSTI prober tool image (no GPL deps). Build-only — the broker
  # sandbox runs it on demand. Build with: docker compose -f docker-compose.lab.yml --profile tools build
  ssti-probe:
    build: ./lab/ssti-probe
    image: shannon-ssti-probe:local
    profiles: [tools]
    command: ["true"]
  idor-lab:
    build: ./lab/idor-app
    image: shannon-lab-idor:local
    container_name: shannon-lab-idor
    networks: [shannon-lab]
  idor-probe:
    build: ./lab/idor-probe
    image: shannon-idor-probe:local
    profiles: [tools]
    command: ["true"]
  jwt-lab:
    build: ./lab/jwt-app
    image: shannon-lab-jwt:local
    container_name: shannon-lab-jwt
    networks: [shannon-lab]
  jwt-probe:
    build: ./lab/jwt-probe
    image: shannon-jwt-probe:local
    profiles: [tools]
    command: ["true"]
  graphql-lab:
    build: ./lab/graphql-app
    image: shannon-lab-graphql:local
    container_name: shannon-lab-graphql
    networks: [shannon-lab]
  graphql-probe:
    build: ./lab/graphql-probe
    image: shannon-graphql-probe:local
    profiles: [tools]
    command: ["true"]
networks:
  shannon-lab:
    name: shannon-lab
